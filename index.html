          ? '<div class="btn-row"><button class="btn" data-routes="shuffle">方面をくじで入れ替える</button>' +
            (d.routeShuffled ? '<button class="btn" data-routes="reset">シートの順に戻す</button>' : '') + '</div>' +
            '<p class="small muted" style="margin:0">くじの結果はチームの画面にすぐ反映されます。方面と目的地そのものは「チーム」シートの「方面」「最初の目的地」で変えられます（空なら上野・浅草・合羽橋の3方面）。</p>'
          : g.routeUntil && now() < g.routeUntil ? '<div class="small">方面しばり：あと <b class="mono" data-countdown="' + g.routeUntil + '" data-mode="ms">' + fmtMS(g.routeUntil - now()) + '</b></div>' : '<div class="small muted">方面しばりは終わりました</div>') +
        '</div></div>';
    }

    if (g.phase === 'ended') {
      html += '<div class="section"><h2>結果発表</h2><div class="card" style="padding:14px;display:grid;gap:10px">' +
        (d.pendingCount ? '<div style="color:var(--warn);font-weight:700">確認待ちの申請が ' + d.pendingCount + ' 件あります。先に処理してください。</div>' : '') +
        '<div>プロジェクター画面に、最下位から1チームずつ発表されます。いま <b>' + d.reveal + ' / ' + d.teams.length + '</b> チームを発表中。</div>' +
        '<div class="btn-row"><button class="btn primary" data-reveal="1"' + (d.reveal >= d.teams.length ? ' disabled' : '') + '>次の順位を発表</button>' +
        '<button class="btn" data-reveal="-1"' + (d.reveal <= 0 ? ' disabled' : '') + '>1つ戻す</button></div></div></div>';
    }

    var el = g.elapsedMin;
    html += '<div class="section"><h2>イベントの予定</h2><div class="table-wrap"><table><thead><tr><th>時刻</th><th>種類</th><th>対象</th><th>メッセージ</th><th>状態</th></tr></thead><tbody>' +
      d.events.map(function (e) {
        var state = !g.startedAt ? '' : el >= e.end && e.end > e.start ? '終了' : el >= e.start && el < e.end ? '<span class="pill hl">実施中</span>' : el >= e.start ? '済' : '予定';
        var at = g.startedAt ? fmtTime(g.startedAt + e.start * 60000) + (e.end > e.start ? '〜' + fmtTime(g.startedAt + e.end * 60000) : '') : e.start + '分' + (e.end > e.start ? '〜' + e.end + '分' : '');
        return '<tr><td class="mono">' + at + '</td><td>' + esc(e.type) + '</td><td>' + esc(e.targets.map(function (id) { return spotName(d, id); }).join('、')) + '</td><td class="small">' + esc(e.message) + '</td><td>' + state + '</td></tr>';
      }).join('') + '</tbody></table></div><p class="small muted">イベントは「イベント」シートで変えられます。</p></div>';

    if (BOOT.baseUrl) {
      html += '<div class="section"><h2>配るURL</h2><div class="table-wrap"><table><tbody>' +
        '<tr><td>参加者（全チーム共通）</td><td class="mono small" style="white-space:normal;word-break:break-all">' + esc(BOOT.baseUrl) + '</td></tr>' +
        '<tr><td>プロジェクター</td><td class="mono small" style="white-space:normal;word-break:break-all">' + esc(BOOT.baseUrl + '?screen') + '</td></tr>' +
        '</tbody></table></div><p class="small muted">参加者は、開いて合言葉を入れるだけでチームが決まります。合言葉は「チーム」シートにあります（運営も同じ画面で運営の合言葉を入れれば入れます）。</p></div>';
    }

    html += '<div class="section"><h2>記録を書き出す</h2><div class="card" style="padding:14px;display:grid;gap:10px">' +
      '<p style="margin:0" class="small">試合の全記録（申請・承認・カード・ペナルティ・記録シート）を、ドライブの「陣取りバトル 写真」フォルダに1つのファイルとして保存します。盤面のタイムラプス動画を作るのに使います。試合が終わってから押してください（何度押しても大丈夫です）。</p>' +
      '<button class="btn" data-exportgame>記録を書き出す</button><div id="exportResult" class="small"></div></div></div>';

    html += '<div class="section"><h2>リセット</h2><div class="card" style="padding:14px;display:grid;gap:10px">' +
      '<p style="margin:0" class="small">占領・カード・得点・申請をすべて消して、開始前に戻します。練習のあとに使ってください。</p>' +
      '<div class="form-row"><input id="resetConfirm" type="text" placeholder="「リセット」と入力" aria-label="確認の文字"><button class="btn danger" data-reset>リセットする</button></div></div></div>';
    return html;
  }

  /** パソコン用のキー操作。A：いちばん上の申請を承認、R：却下の理由を選ぶ、1〜4：理由、Esc：閉じる */
  function onAdminKey(e) {
    if (!A || e.ctrlKey || e.metaKey || e.altKey || e.repeat) return;
    if (/^(INPUT|TEXTAREA|SELECT)$/.test((e.target && e.target.tagName) || '')) return;
    var key = e.key.toLowerCase();
    if (!modal.hidden) {
      if (key === 'escape') { closeSheet(); return; }
      var reasons = $$('.sheet [data-reason]', modal);
      var n = Number(key);
      if (n >= 1 && n <= reasons.length) { e.preventDefault(); reasons[n - 1].click(); }
      return;
    }
    if (!popEl.hidden || A.tab !== 'req') return;
    if (key === 'a') {
      var ok = $('#aPane [data-approve]:not([disabled])');
      if (ok) { e.preventDefault(); ok.click(); }
    } else if (key === 'r') {
      var ng = $('#aPane [data-rejectask]');
      if (ng) { e.preventDefault(); ng.click(); }
    }
  }

  /** 却下の理由を選ぶシート。理由を押した時点で却下が確定する */
  function openReject(id) {
    var d = A.data;
    var r = d.requests.find(function (x) { return x.id === id; });
    if (!r) return;
    var team = teamMap(d.teams)[r.team];
    var sh = openSheet(
      '<h2>却下の理由を選ぶ</h2>' +
      '<div class="btn-row" style="align-items:center">' + chip(team) + '<b>' + esc(spotName(d, r.spot)) + '</b></div>' +
      '<p class="small muted" style="margin:0">理由はチームに通知されます。押すとすぐに却下されます。</p>' +
      '<div class="reasons-list">' +
      REJECT_REASONS.filter(function (x) { return x !== 'その他'; }).map(function (x, i) {
        return '<button class="btn block" data-reason="' + esc(x) + '"><span class="kbd-hint mono muted">' + (i + 1) + '</span>' + esc(x) + '</button>';
      }).join('') + '</div>' +
      '<form id="rejForm" class="form-row"><input id="rejText" type="text" placeholder="ほかの理由を書く" aria-label="ほかの理由"><button class="btn" style="flex:0 0 auto">この理由で却下</button></form>' +
      '<button class="btn block" data-close style="border-color:var(--line)">やめる</button>'
    );
    function send(reason, btn) {
      $$('button', sh).forEach(function (x) { x.disabled = true; });
      btn.textContent = '却下しています…';
      adminDo('reject', { id: id, reason: reason }).then(closeSheet);
    }
    $$('[data-reason]', sh).forEach(function (btn) {
      btn.onclick = function () { send(btn.dataset.reason, btn); };
    });
    $('#rejForm', sh).onsubmit = function (e) {
      e.preventDefault();
      var text = $('#rejText', sh).value.trim();
      if (!text) { $('#rejText', sh).focus(); return; }
      send(text, $('#rejForm button', sh));
    };
  }

  function onAdminClick(e) {
    var b = e.target.closest('button, img[data-zoom]');
    if (!b || b.disabled) return;
    if (b.dataset.push) {
      if (b.dataset.push === 'off') {
        pushUnsubscribe('admin').catch(function () {}).then(function () { toast('通知をやめました'); A.sig = ''; renderAdmin(); });
        return;
      }
      b.disabled = true;
      pushSubscribe('admin', A.pin).then(function () { toast('新しい申請などを通知します'); }).catch(function (err) { toast(err.message, true); })
        .then(function () { A.sig = ''; renderAdmin(); });
      return;
    }
    if (b.dataset.zoom) {
      openSheet('<img src="' + b.src + '" alt="申請の写真" style="width:100%;border-radius:10px"><button class="btn block" data-close>閉じる</button>');
      return;
    }
    if (b.dataset.approve) return adminDo('approve', { id: b.dataset.approve }, b);
    if (b.dataset.rejectask) return openReject(b.dataset.rejectask);
    if (b.dataset.undo) {
      if (!armed(b, '取り消す？')) return;
      return adminDo('undo', { id: b.dataset.undo }, b);
    }
    if ('announce' in b.dataset) {
      var text = $('#annText').value.trim();
      if (!text) { toast('お知らせの文章を入れてください', true); return; }
      if (!armed(b, '送信する？')) return;
      return adminDo('announce', { to: $('#annTo').value, text: text }, b).then(function () {
        var t = document.getElementById('annText');
        if (t) t.value = '';
      });
    }
    if (b.dataset.aireject) return adminDo('reject', { id: b.dataset.aireject, reason: b.dataset.reason }, b);
    if (b.dataset.airetry) {
      delete A.aiState[b.dataset.airetry];
      A.sig = '';
      return renderAdmin();
    }
    if (b.dataset.setowner) {
      if (!armed(b, '本当に変える？')) return;
      return adminDo('setOwner', { spot: b.dataset.setowner, team: document.getElementById('own-' + b.dataset.setowner).value }, b);
    }
    if ('penalty' in b.dataset) {
      var parts = $('#penReason').value.split('|');
      var pts = Number($('#penPts').value) || Number(parts[1]);
      return adminDo('penalty', { team: $('#penTeam').value, pts: pts, reason: parts[0] }, b).then(function () {
        var p = document.getElementById('penPts');
        if (p) p.value = '';
      });
    }
    if ('givecard' in b.dataset) {
      if (!armed(b, 'もう一度押すと渡します')) return;
      return adminDo('giveCard', { team: $('#giftTeam').value, type: $('#giftCard').value, reason: $('#giftReason').value }, b);
    }
    if (b.dataset.rmcard) {
      if (!armed(b, '消す？')) return;
      var rc = b.dataset.rmcard.split('|');
      return adminDo('removeCard', { team: rc[0], id: rc[1] }, b);
    }
    if (b.dataset.unpenalty) {
      if (!armed(b, '取り消す？')) return;
      return adminDo('removePenalty', { id: b.dataset.unpenalty }, b);
    }
    if ('start' in b.dataset) {
      if (!armed(b, 'もう一度押すと開始します')) return;
      return adminDo('start', {}, b);
    }
    if (b.dataset.shift) {
      var mins = Math.round(Number($('#shiftMin').value));
      if (!(mins >= 1 && mins <= 600)) { toast('1〜600の分数を入れてください', true); return; }
      if (!armed(b, mins + '分' + (b.dataset.shift === '1' ? '延ばす' : '縮める') + '？')) return;
      return adminDo('shiftClock', { min: mins * Number(b.dataset.shift) }, b);
    }
    if ('publish' in b.dataset) return adminDo('publish', {}, b);
    if (b.dataset.routes) {
      if (b.dataset.routes === 'shuffle' && !armed(b, 'もう一度押すとくじを引きます')) return;
      return adminDo(b.dataset.routes === 'shuffle' ? 'shuffleRoutes' : 'resetRoutes', {}, b);
    }
    if (b.dataset.reveal) return adminDo('reveal', { step: Number(b.dataset.reveal) }, b);
    if ('exportgame' in b.dataset) {
      b.disabled = true;
      return call('exportGame', A.pin).then(function (r) {
        b.disabled = false;
        var out = document.getElementById('exportResult');
        if (out) out.innerHTML = '保存しました：<b>' + esc(r.name) + '</b>' + (r.url ? '　<a href="' + esc(r.url) + '" target="_blank" rel="noopener">ドライブで開く</a>' : '');
        toast('記録を書き出しました');
      }).catch(function (err) {
        b.disabled = false;
        toast(err.message, true);
      });
    }
    if ('reset' in b.dataset) {
      return adminDo('reset', { confirm: $('#resetConfirm').value.trim() }, b);
    }
  }

  // ───────── プロジェクター画面 ─────────

  var S = null;

  /** プロジェクター：音はブラウザの決まりで1回クリックするまで出ないので、右下に案内を出す（音が出たら消える） */
  function audioHint() {
    if (Sound.ctx && Sound.ctx.state === 'running') return;
    if ($('.audio-hint')) { $('.audio-hint').hidden = false; return; }
    var el = document.createElement('div');
    el.className = 'audio-hint';
    el.textContent = '🔈 画面を1回クリックすると、BGMと効果音が出ます';
    document.body.appendChild(el);
  }

  function startScreen() {
    S = { prevReveal: 0, seen: null };
    Bgm.setScope('screen');
    audioHint();
    document.body.classList.add('on-screen');
    app.innerHTML = '<div class="screen" id="scr"></div>';
    S.stop = poller(screenPoll, 3000);
    keepAwake();
  }

  function screenPoll() {
    var mine = S;
    return call('getScreenView').then(function (d) {
      if (S !== mine) return; // 最初の画面に戻ったあとに届いた返事は使わない
      clockOffset = d.now - Date.now();
      renderScreen(d);
      screenPopups(d);
    });
  }

  /** 会場向けに、イベントの開始や盤面の公開を大きく出す。8秒で自動で消える */
  function screenPopups(d) {
    var g = d.game, items = [];
    if (g.startedAt) {
      var start = g.startedAt;
      items.push({ key: 'start:' + start, at: start, show: function () {
        // 各チームの方面を発表する（最初の目的地の名前はチームのスマホだけに出す）
        var tmS = teamMap(d.teams);
        var rs = (d.routes || []).filter(function (x) { return x.label; });
        popup({ kicker: 'ゲーム開始', title: 'ゲームスタート！', tone: 'start', auto: rs.length ? 14 : 8,
          body: rs.length ? '<div class="small muted" style="margin-bottom:6px">最初の' + g.routeMin + '分は、自分の方面の陣地だけ申請できます</div>' + rs.map(function (x) {
            return '<div class="line">' + chip(tmS[x.team]) + ' → <b>' + esc(x.label) + '</b></div>';
          }).join('') : '' });
      } });
      g.feed.forEach(function (f) {
        items.push({ key: 'f:' + start + ':' + f.id, at: f.at, show: function () {
          var ev = feedEvent(f, true);
          ev.big = true;
          showFeedEvent(ev, 8);
        } });
      });
      var pub = d.published;
      if (pub && pub.at - start > 5000) {
        items.push({ key: 'p:' + pub.at, at: pub.at, show: function () {
          var top = rankList(pub.scores, d.teams)[0];
          popup({ kicker: '盤面公開', title: fmtTime(pub.at) + ' の盤面を公開', tone: 'publish', auto: 8,
            body: top ? '<div class="line">いまの1位 ' + chip(top.team) + ' ' + top.s.total + '点</div>' : '' });
        } });
      }
      if (g.phase === 'ended') {
        items.push({ key: 'end:' + start, at: g.endsAt, show: function () {
          popup({ kicker: 'ゲーム終了', title: 'ゲーム終了！', body: 'まもなく結果発表です', tone: 'publish', auto: 8 });
        } });
      }
      (d.announces || []).forEach(function (a) {
        items.push({ key: 'a:' + a.id, at: a.at, show: function () {
          popup({ kicker: '運営からのお知らせ', title: a.text, tone: 'alert', auto: 12 });
        } });
      });
    }
    if (!S.seen) {
      S.seen = {};
      items.forEach(function (i) { S.seen[i.key] = true; });
      return;
    }
    items.filter(function (i) { return !S.seen[i.key]; }).sort(function (a, b) { return a.at - b.at; }).forEach(function (i) {
      S.seen[i.key] = true;
      i.show();
    });
  }

  function renderScreen(d) {
    var g = d.game;
    Bgm.setMode(Bgm.modeFor(g));
    var tm = teamMap(d.teams);
    var root = $('#scr');
    var phase = { waiting: ['開始前', ''], playing: ['ゲーム中', 'ok'], break: ['休憩中', 'warn'], ended: ['終了', 'dark'] }[g.phase];
    // 会場から見えるように、次の盤面公開と次のイベントまでの時間を大きく出す
    var nexts = '';
    if (g.phase !== 'ended' && g.startedAt) {
      if (g.routeUntil && now() < g.routeUntil) nexts += '<div class="screen-next"><span>方面しばり 終了まで</span><b data-countdown="' + g.routeUntil + '" data-mode="ms">' + fmtMS(g.routeUntil - now()) + '</b></div>';
      if (g.nextPublishAt && !g.blackout) nexts += '<div class="screen-next"><span>次の盤面公開</span><b data-countdown="' + g.nextPublishAt + '" data-mode="ms">' + fmtMS(g.nextPublishAt - now()) + '</b></div>';
      if (g.next) nexts += '<div class="screen-next"><span>' + esc(g.next.type === 'ボーナス' ? 'ボーナスタイム' : g.next.type) + 'まで</span><b data-countdown="' + g.next.at + '" data-mode="ms">' + fmtMS(g.next.at - now()) + '</b></div>';
    }
    // ゲーム中は時計が動いているので「ゲーム中」の札は出さない（残り時間の札に場所を空ける）
    var head = '<div class="screen-head">' + homeButton() + '<h1>' + esc(g.name) + '</h1>' + nexts +
      (g.phase !== 'playing' ? '<span class="pill ' + phase[1] + '" style="font-size:clamp(14px,1.4vw,24px);padding:.5em .9em">' + phase[0] + '</span>' : '') +
      (g.blackout ? '<span class="pill dark" style="font-size:clamp(14px,1.4vw,24px);padding:.5em .9em">ブラックアウト</span>' : '') +
      soundButton() + bgmButton() +
      '<div class="screen-clock"' + (g.endsAt && g.phase !== 'ended' ? ' data-countdown="' + g.endsAt + '" data-mode="clock"' : '') + '>' +
      (g.endsAt && g.phase !== 'ended' ? fmtClock(g.endsAt - now()) : g.phase === 'ended' ? '0:00:00' : fmtClock(g.durationMin * 60000)) + '</div></div>';

    if (d.final && d.reveal > 0) {
      var list = rankList(d.final.scores, d.teams);
      var n = d.teams.length;
      var just = d.reveal !== S.prevReveal;
      var rows = list.map(function (x, i) {
        var pos = i + 1;
        var shown = pos > n - d.reveal;
        var isJust = just && pos === n - d.reveal + 1;
        // 和×ネオン：墨の地にチームの色の線。1位は金の縁と光沢
        return '<div class="row' + (shown ? ' shown' : ' hidden') + (shown && x.rank === 1 ? ' r1' : '') + (isJust ? ' just' : '') + '"' + (shown ? ' style="--tc:' + esc(x.team.color) + '"' : '') + '>' +
          '<div class="no">' + (shown ? x.rank + '位' : '?') + '</div>' +
          '<div><div class="nm">' + (shown ? esc(x.team.name) : '？？？') + '</div>' + (shown ? '<div class="bd">' + breakdown(x.s) +
            (d.final.walk && d.final.walk[x.team.id] ? '・歩いた道のり ' + esc(fmtDist(d.final.walk[x.team.id])) : '') + '</div>' : '') + '</div>' +
          '<div class="sc">' + (shown ? x.s.total + '<span style="font-size:.4em">点</span>' : '') + '</div></div>';
      }).join('');
      S.prevReveal = d.reveal;
      root.innerHTML = head + '<div class="reveal">' + rows + '</div><div class="screen-foot">最終結果</div>';
      // 1位が出た瞬間に、金と各チームの色の紙吹雪
      if (just && d.reveal >= n) fxConfetti(d.teams.map(function (t) { return t.color; }));
      if (just) Sound.play(d.reveal >= n ? 'fanfare' : 'reveal');
      return;
    }
    S.prevReveal = d.reveal;

    var pub = d.published;
    var ranks = pub ? rankList(pub.scores, d.teams) : [];
    var rankHtml = '<div class="screen-rank">' + (ranks.length ? ranks.map(function (x) {
      return '<div class="row' + (x.rank === 1 ? ' top' : '') + '" style="--tc:' + esc(x.team.color) + '"><div class="no">' + x.rank + '</div><div class="nm">' + esc(x.team.name) + '</div><div class="sc">' + x.s.total + '</div></div>';
    }).join('') : '<div class="empty">ゲームが始まると得点が出ます</div>') + '</div>';
    var areas = '<div class="areas">' + groupBy(d.spots, areaKey).map(function (grp) {
      return '<div class="area"><h3>' + esc(grp.key) + '</h3><div class="tiles">' + grp.items.map(function (s) {
        var o = pub && pub.owners[s.id] ? tm[pub.owners[s.id]] : null;
        return '<div class="tile' + (o ? ' owned' : '') + '"' + (o ? ' style="--tc:' + esc(o.color) + '"' : '') + '>' + esc(s.name) + '<br><span style="opacity:.75">' + s.pts + '点</span></div>';
      }).join('') + '</div></div>';
    }).join('') + '</div>';
    var foot = g.phase === 'ended'
      ? 'ゲーム終了。結果発表をお待ちください'
      : (pub ? '盤面 ' + fmtTime(pub.at) + ' 時点' : '') + (g.blackout ? '・ブラックアウト中は更新されません' : '');
    var useMap = MAP && d.spots.some(function (s) { return s.pos; });
    // 地図が1枚で横長なら、順位を上に横並びにして、地図を横いっぱいに大きく出す
    var wide = useMap && ZONES.length === 1 && ZONES[0].width / ZONES[0].height > 1.6;
    root.innerHTML = head + '<div class="screen-main' + (wide ? ' wide' : '') + '">' + rankHtml + (useMap ? '<div id="scrMapSlot" class="screen-map"></div>' : areas) + '</div><div class="screen-foot">' + esc(foot) + soundCredit() + '</div>';
    if (useMap) {
      S.last = d;
      renderMapArea(document.getElementById('scrMapSlot'), S, d.spots.map(function (s) {
        var o = pub && pub.owners[s.id] ? tm[pub.owners[s.id]] : null;
        return { id: s.id, pos: s.pos, icon: s.icon, color: o ? o.color : '', label: shortName(s.name), hidden: s.hidden, area: s.area };
      }), { onTap: null, pinPx: 72, big: true, rerender: function () { renderScreen(S.last); } });
    }
  }

  // ───────── 起動 ─────────

  if (BOOT.view === 'admin') startAdminLogin();
  else if (BOOT.view === 'screen') startScreen();
  else if (BOOT.view === 'team' && BOOT.team) {
    var saved = store.get('auth');
    if (saved && saved.team === BOOT.team) startTeam(saved.team, saved.pin);
    else startHome(); // 合言葉だけでチームが決まるので、チームのURLから来ても最初の画面で合言葉を入れてもらう
  } else {
    // ホーム画面から開いたときなどは、前に入ったチームの画面へそのまま入る
    var last = store.get('auth');
    var stayHome = false;
    try { stayHome = sessionStorage.getItem('jintori.home') === '1'; } catch (err) {}
    if (last && last.team && last.pin && !stayHome) startTeam(last.team, last.pin);
    else startHome();
  }
})();
</script>

</body>
</html>
