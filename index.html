  function renderHome(h) {
    Bgm.setScope('phone');
    Bgm.setMode(Bgm.modeFor(h));
    var last = store.get('auth');
    var lastTeam = last && last.pin && h.teams.find(function (t) { return t.id === last.team; });
    var adminPin = store.get('admin');
    var len = h.pinLen || 0;
    // 前に入ったことがある人は、合言葉を入れ直さずに戻れる（最初の画面のボタンで戻ってきたとき）
    var resume = '';
    if (lastTeam) {
      resume += '<button type="button" class="home-resume" id="hResume" style="--tc:' + esc(lastTeam.color) + '">' +
        '<span class="hr-dot"></span><span class="grow">' + esc(lastTeam.name) + 'に戻る</span><span aria-hidden="true">›</span></button>';
    }
    if (adminPin) {
      resume += '<button type="button" class="home-resume" id="hAdmin" style="--tc:var(--kin)"><span class="hr-dot"></span><span class="grow">運営画面に戻る</span><span aria-hidden="true">›</span></button>';
    }
    var boxes = '';
    for (var i = 0; i < len; i++) boxes += '<span class="pin-box"></span>';
    app.innerHTML =
      '<div class="wrap home">' +
      '<div class="home-brand"><img src="icons/icon-192.png" alt="" onerror="this.style.display=\'none\'"><h1>' + esc(h.name) + '</h1></div>' +
      homeStatus(h) +
      (resume ? '<div class="home-resumes">' + resume + '</div>' : '') +
      '<form class="home-pin" id="hForm" autocomplete="off">' +
      '<h2>合言葉を入れてください</h2>' +
      '<p class="muted small">運営から配られた' + (len ? len + 'けたの数字' : '合言葉') + 'です</p>' +
      (len
        ? '<label class="pin-boxes">' + boxes +
          '<input id="hPin" type="tel" inputmode="numeric" pattern="[0-9]*" maxlength="' + len + '" autocomplete="one-time-code" aria-label="合言葉"></label>' +
          '<p class="muted small">' + len + 'けた入れると自動で入ります</p>'
        : '<input id="hPin" class="pin-input" type="text" autocomplete="off" maxlength="20" aria-label="合言葉" placeholder="合言葉">' +
          '<button class="btn primary block" style="margin-top:12px">入る</button>') +
      '<p class="home-err" id="hErr" role="alert" hidden></p>' +
      '</form>' +
      '<div class="grow"></div>' +
      homeInstallHint() +
      '<p class="home-help">合言葉が分からないときは、運営に聞いてください。</p>' +
      '</div>';

    var input = $('#hPin');
    var busy = false;
    function paint() {
      if (!len) return;
      var v = input.value;
      var focused = document.activeElement === input;
      $$('.pin-box').forEach(function (b, i) {
        b.textContent = v[i] || '';
        b.classList.toggle('filled', i < v.length);
        b.classList.toggle('cur', focused && i === Math.min(v.length, len - 1));
      });
    }
    function submit() {
      var pin = input.value.trim();
      if (!pin || busy) return;
      busy = true;
      $('#hErr').hidden = true;
      $('#hForm').classList.add('busy');
      call('loginByPin', pin, deviceId()).then(function (r) {
        busy = false;
        if (r.role === 'admin') {
          store.set('admin', r.pin);
          startAdmin(r.pin);
          return;
        }
        homeConfirm(h, r);
      }).catch(function (e) {
        busy = false;
        var f = $('#hForm');
        if (!f) return;
        f.classList.remove('busy');
        var p = $('#hErr');
        p.textContent = e.network ? '通信できませんでした。電波を確認して、もう一度入れてください' : e.message;
        feel('pinng');
        p.hidden = false;
        input.value = '';
        paint();
        f.classList.remove('shake');
        void f.offsetWidth; // 揺れるアニメーションをやり直す
        f.classList.add('shake');
        input.focus();
      });
    }
    input.addEventListener('input', function () {
      if (len) {
        input.value = input.value.replace(/[０-９]/g, function (c) { return String.fromCharCode(c.charCodeAt(0) - 0xFEE0); })
          .replace(/[^0-9]/g, '').slice(0, len);
      }
      $('#hErr').hidden = true;
      $('#hForm').classList.remove('shake');
      paint();
      if (len && input.value.length) Sound.play('pinkey', input.value.length - 1); // 1けたごとに琴がポロン
      if (len && input.value.length === len) submit();
    });
    input.addEventListener('focus', paint);
    input.addEventListener('blur', paint);
    $('#hForm').onsubmit = function (e) { e.preventDefault(); submit(); };
    if ($('#hResume')) $('#hResume').onclick = function () { startTeam(last.team, last.pin); };
    if ($('#hAdmin')) $('#hAdmin').onclick = function () { startAdmin(adminPin); };
    if ($('#hInstallX')) {
      $('#hInstallX').onclick = function () {
        store.set('installHintOff', true);
        $('#hInstall').hidden = true;
      };
    }
    // 初めての人だけ、すぐ打てるようにキーボードを出す（戻ってきた人は「〇〇に戻る」を押すことが多いので出さない）
    if (!resume) setTimeout(function () { if (document.body.contains(input)) input.focus(); }, 80);
    paint();
    if (homeTimer) clearInterval(homeTimer);
    homeTimer = $('#hClock') ? setInterval(homeTick, 1000) : null;
  }

  /** 合言葉が合ったら、どのチームに入るかを大きく見せて確かめてもらう（聞き間違いで別のチームに入らないように） */
  function homeConfirm(h, r) {
    var t = r.team;
    app.innerHTML =
      '<div class="wrap home-ok">' +
      '<div class="ok-glow" style="background:radial-gradient(circle at 50% 38%, ' + esc(t.color) + '40, transparent 62%)"></div>' +
      // 入る瞬間の演出だけネオン：六角形の陣地の形を、チームの色で光らせる
      '<svg class="ok-mark" viewBox="0 0 100 100" aria-hidden="true" style="--tc:' + esc(t.color) + '">' +
      '<polygon points="50,4 90,27 90,73 50,96 10,73 10,27" class="ok-hex"/>' +
      '<text x="50" y="63" text-anchor="middle" class="ok-ch">' + esc(Array.from(t.name)[0] || '') + '</text></svg>' +
      '<p class="muted">あなたのチームは</p>' +
      '<h1>' + esc(t.name) + '</h1>' +
      (t.route ? '<p class="muted ok-route">' + esc(t.route) + '</p>' : '') +
      '<button type="button" class="btn primary block ok-go" id="hGo">はじめる ›</button>' +
      '<button type="button" class="ok-back" id="hBack">ちがうチームだった</button>' +
      '</div>';
    $('#hGo').onclick = function () {
      store.set('auth', { team: t.id, pin: r.pin });
      startTeam(t.id, r.pin);
    };
    $('#hBack').onclick = function () { renderHome(h); };
    feel('pinok');
    // 六角形が描き終わるころに、六角形の真ん中から火花を散らす
    setTimeout(function () {
      var host = $('.home-ok'), hx = $('.home-ok svg.ok-mark');
      if (!host || !hx) return;
      var r = hx.getBoundingClientRect(), hr = host.getBoundingClientRect();
      fxBurst(host, t.color, { y: (r.top - hr.top + r.height / 2).toFixed(0) + 'px', n: 20 });
    }, 520);
  }

  function pinSheet(title, sub, onSubmit) {
    var sh = openSheet(
      '<h2>' + esc(title) + '</h2>' +
      (sub ? '<p class="muted" style="margin:0">' + esc(sub) + '</p>' : '') +
      '<form id="pinForm" style="display:grid;gap:12px">' +
      '<input id="pin" class="pin-input" type="tel" inputmode="numeric" autocomplete="off" maxlength="8" placeholder="····" aria-label="合言葉">' +
      '<p id="pinErr" class="small" style="color:var(--bad);margin:0" hidden></p>' +
      '<div class="btn-row"><button type="button" class="btn" data-close>やめる</button><button class="btn primary" style="flex:1">入る</button></div>' +
      '</form>'
    );
    var input = $('#pin', sh);
    setTimeout(function () { input.focus(); }, 50);
    $('#pinForm', sh).onsubmit = function (e) {
      e.preventDefault();
      var btn = $('button.primary', sh);
      btn.disabled = true;
      onSubmit(input.value.trim()).catch(function (err) {
        btn.disabled = false;
        var p = $('#pinErr', sh);
        p.textContent = err.message;
        p.hidden = false;
      });
    };
  }

  // ───────── チーム画面 ─────────

  var T = null;
  var CARD_DESC = {
    'シールド': function (g) { return '自分の陣地を1つ選んで、' + g.shieldMin + '分間ロックする。奪われないように守れます'; },
    'ダブル': function () { return '占領の申請と一緒に使うと、その陣地の点数をボーナスでもう一度もらえる'; },
    '偵察': function () { return '使った瞬間の最新の盤面と得点を見られる。ブラックアウト中でも使えます'; },
    '奇襲': function () { return '占領の申請と一緒に使うと、ロック中の陣地でも奪える'; },
    '交換': function () { return '相手チームを選ぶと、お互いのカードを1枚ずつランダムに入れ替える'; },
    'ヒント先取り': function () { return 'まだ公開されていない、なぞの名所のヒントを1つ、自分のチームだけ先に見られる'; },
    '封鎖': function (g) { return '陣地を1つ選ぶと、' + (g.blockMin || 10) + '分間はどのチームも（自分も）申請できなくなる。奇襲でも破れません'; },
    'ボーナス': function () { return '使うとすぐに1点もらえる'; },
    '特大ボーナス': function () { return '使うとすぐに5点もらえる'; },
    'トラップ': function () { return '自分の陣地を1つ選んで仕掛ける。ほかのチームがその陣地を奪おうとする（占領の承認・強奪）と失敗し、そのチームから3点もらえる。相手には見えません'; },
    'フィーバー': function (g) { return '使ってから' + (g.feverMin || 20) + '分間、占領するたびにその陣地の点数がもう一回入る（2倍）'; },
    '強奪': function () { return 'ほかのチームの陣地を1つ選ぶと、写真も承認もなしで、その場で自分の陣地にできる。ロック中・封鎖中でも奪えます'; },
    'レーダー': function (g) {
      var m = g.radarMin || 1;
      return '使うと' + (m >= 1 ? m + '分' : Math.round(m * 60) + '秒') + 'のあいだ、ほかのチームの最後の位置が自分の地図に出る（位置を使っていないチームは出ません）';
    },
  };

  /** カードの★（レアリティ）。★の数はサーバーの CARD_STARS から届く */
  function cardStars(type, g) {
    var n = (g && g.cardStars && g.cardStars[type]) || 1;
    return n;
  }
  function starText(n) {
    return new Array(n + 1).join('★');
  }
  function cardLabel(type, g) {
    return starText(cardStars(type, g)) + ' ' + type;
  }

  function startTeam(teamId, pin) {
    if (T && T.stop) T.stop();
    Bgm.setScope('phone');
    try { sessionStorage.removeItem('jintori.home'); } catch (err) {}
    T = { teamId: teamId, pin: pin, data: null, tab: store.get('tab') || 'spots', sort: store.get('sort') || 'area', seenAt: store.get('seen.' + teamId) || 0 };
    // 画面のつくり：上（チーム・順位・残り時間・お知らせのベル）／真ん中（タブの中身）／下（片手で押せるメニューと、真ん中の大きな申請ボタン）
    app.innerHTML =
      '<header class="bar"><div class="wrap bar-in">' + homeButton() +
      '<div class="grow"><div class="team-name"><span class="team-dot" id="tSwatch"></span><span id="tName">読み込み中…</span></div><div class="bar-sub"><span id="tRank" class="my-rank"></span><span id="tPhase" style="display:contents"></span></div></div>' +
      '<div style="text-align:right"><div class="clock-label">残り時間</div><div class="clock" id="tClock">-:--:--</div></div>' +
      '<button type="button" class="bell" id="tBell" aria-label="お知らせ">' + TAB_ICON.news + '<span class="bell-dot" hidden></span></button>' +
      '</div></header>' +
      '<main class="wrap"><div id="tVer"></div><div id="tBanners"></div>' +
      '<div id="tPane"></div><div class="tabbar-space"></div></main>' +
      '<nav class="tabbar" role="tablist" aria-label="メニュー" id="tTabs"></nav>';
    $('#tBanners').addEventListener('click', onGeoBannerClick);
    $('#tBanners').addEventListener('click', onTeamExtraClick);
    $('#tPane').addEventListener('click', onTeamExtraClick);
    Outbox.load().then(function () { if (T && T.data) renderTeam(); outboxFlush(); });
    function goTab(tab) {
      if (T.tab === tab) { window.scrollTo({ top: 0, behavior: 'smooth' }); return; }
      T.tab = tab;
      store.set('tab', T.tab);
      renderTeam();
      window.scrollTo({ top: 0 });
    }
    $('#tTabs').onclick = function (e) {
      if (e.target.closest('[data-capmain]')) { openCapture(); return; }
      var b = e.target.closest('[data-tab]');
      if (b) goTab(b.dataset.tab);
    };
    $('#tBell').onclick = function () { goTab('news'); };
    $('#tPane').addEventListener('click', onTeamPaneClick);
    T.stop = poller(teamPoll, 10000);
  }

  function teamPoll() {
    var mine = T;
    if (!mine) return Promise.resolve();
    return call('getTeamView', T.teamId, T.pin).then(function (d) {
      if (T !== mine) return; // 最初の画面に戻ったあとに届いた返事は使わない
      clockOffset = d.now - Date.now();
      T.data = d;
      renderTeam();
      teamPopups(d);
      // つながっているので、預かっている申請があれば送る
      if (Outbox.items.some(function (x) { return x.team === T.teamId; })) outboxFlush();
    }).catch(function (e) {
      if (T !== mine) return;
      if (e.auth) {
        store.del('auth');
        T.stop();
        geoStop();
        toast(e.message, true);
        startHome();
      }
    });
  }

  function renderTeam() {
    var d = T.data;
    if (!d) return;
    var g = d.game;
    var tm = teamMap(d.teams);
    geoSync();
    $('#tSwatch').style.background = d.me.color;
    Bgm.setMode(Bgm.modeFor(d.game));
    $('#tName').textContent = d.me.name;

    // ゲーム中は時計が動いているので「ゲーム中」は出さず、ほかの状態のときだけ出す
    var phase = { waiting: ['開始前', ''], playing: null, break: ['休憩中', 'warn'], ended: ['終了', 'dark'] }[g.phase];
    $('#tPhase').innerHTML = (phase ? '<span class="pill ' + phase[1] + '">' + phase[0] + '</span>' : '') + (g.blackout ? '<span class="pill dark">ブラックアウト</span>' : '');
    $('#tRank').innerHTML = myRankHtml(d);
    // 点数が増えたら、上の数字をカウントアップして金色に光らせる
    var ptsEl = $('#tRank .pts-now');
    var ptsNow = ptsEl ? Number(ptsEl.textContent) : null;
    if (ptsEl && T.lastPts != null && ptsNow !== T.lastPts) fxCount(ptsEl, T.lastPts, ptsNow);
    T.lastPts = ptsNow;

    var clock = $('#tClock');
    if (g.endsAt && g.phase !== 'ended') { clock.dataset.countdown = g.endsAt; clock.dataset.mode = 'clock'; clock.textContent = fmtClock(g.endsAt - now()); }
    else { delete clock.dataset.countdown; clock.textContent = g.phase === 'ended' ? '0:00:00' : fmtClock(g.durationMin * 60000); }

    $('#tVer').innerHTML = versionBanner(d.version, '?t=' + encodeURIComponent(T.teamId));
    var waiting = d.spots.filter(function (s) { return s.requested; });
    // お願い（位置・通知）は一度に1つだけ出す
    var ask = geoBanner(d) || pushBanner(d);
    $('#tBanners').innerHTML = outboxBanner() + routeBanner(d) + ask + gameBanners(g) + (d.radar && d.radar.until > now()
      ? '<div class="banner radar-banner"><div><div>📡 レーダー作動中（残り <span class="mono" data-countdown="' + d.radar.until + '" data-mode="clock">' + fmtClock(d.radar.until - now()) + '</span>）</div>' +
        '<div class="sub">' + (d.radar.teams.length ? '「地図」タブに、ほかのチームの最後の位置が出ています' : '位置が分かるチームがいません（位置を使っていないチームは出ません）') + '</div></div></div>'
      : '') + (d.fever > now()
      ? '<div class="banner"><div><div>🔥 フィーバー中（<span class="mono" data-countdown="' + d.fever + '">' + fmtIn(d.fever) + '</span>）</div><div class="sub">占領するたびに、その陣地の点数がもう一回入ります（申請した時刻で判定）</div></div></div>'
      : '') + (waiting.length
      ? '<div class="slim warn"><span>⏳ 確認待ち ' + waiting.length + '件</span><span class="grow">' + esc(waiting.map(function (s) { return shortName(s.name); }).join('、')) + '</span></div>'
      : '');
    syncBarHeight();

    var feed = teamFeed(d);
    if (T.tab === 'news' && feed.length) { T.seenAt = feed[0].at; store.set('seen.' + T.teamId, T.seenAt); }
    var unreadN = feed.filter(function (f) { return f.at > T.seenAt; }).length;
    // アイコンの数字：まだ見ていないお知らせの数。上のベルにも点を出す
    setBadge(unreadN);
    $('#tBell .bell-dot').hidden = !unreadN;
    $('#tBell').setAttribute('aria-pressed', String(T.tab === 'news'));

    // 下のメニュー。真ん中は申請ボタン（ゲーム中だけ押せる）
    var canCap = g.phase === 'playing';
    var capLabel = { waiting: '開始前', playing: '申請', break: '休憩中', ended: '終了' }[g.phase];
    var tabs = [['spots', '陣地'], ['map', '地図'], ['cap'], ['cards', 'カード'], ['score', '得点']].filter(function (t) { return t[0] !== 'map' || MAP; });
    $('#tTabs').innerHTML = tabs.map(function (t) {
      if (t[0] === 'cap') {
        return '<button type="button" class="tb-cap" data-capmain' + (canCap ? '' : ' disabled') + ' aria-label="占領を申請する">' +
          '<span class="tb-cap-ring">' + ICON.camera + '</span><span class="tb-label">' + capLabel + '</span></button>';
      }
      var badge = t[0] === 'cards' && d.cards.length ? '<b class="tb-badge">' + d.cards.length + '</b>' : '';
      return '<button type="button" class="tb" role="tab" data-tab="' + t[0] + '" aria-selected="' + (T.tab === t[0]) + '">' +
        '<span class="tb-ic">' + TAB_ICON[t[0]] + badge + '</span><span class="tb-label">' + t[1] + '</span></button>';
    }).join('');

    // タブを切り替えたときだけ、中身をふわっと出す（どの画面に来たか分かるように）
    var pane = $('#tPane');
    if (T.shownTab !== T.tab) {
      T.shownTab = T.tab;
      pane.classList.remove('pane-in');
      void pane.offsetWidth;
      pane.classList.add('pane-in');
      // 行やカードが順にふわっと並ぶ動きは切り替えた直後だけ。10秒ごとの描き直しでまた並ばないよう、終わったら外す
      clearTimeout(T.paneInTimer);
      T.paneInTimer = setTimeout(function () { pane.classList.remove('pane-in'); }, 900);
    }
    if (T.tab === 'cards') renderKeeping(pane, teamCards(d));
    else if (T.tab === 'score') pane.innerHTML = teamScore(d, tm);
    else if (T.tab === 'news') pane.innerHTML = teamNews(d, feed);
    else if (T.tab === 'map' && MAP) renderTeamMap(d, tm, pane);
    else pane.innerHTML = teamSpots(d, tm);
  }

  function renderTeamMap(d, tm, pane) {
    var pub = d.published;
    var placed = d.spots.filter(function (s) { return s.pos; });
    var outside = Geo.pos && !zoneOf(Geo.pos);
    var radar = d.radar && d.radar.until > now();
    // 色の見本（文章で説明する代わり）
    var legend = d.teams.map(function (t) {
      return '<span class="lg"><i style="background:' + esc(t.color) + '"></i>' + esc(t.id === d.me.id ? '自陣' : shortTeam(t.name)) + '</span>';
    }).join('') +
      '<span class="lg"><i class="lg-pending" style="border-color:' + esc(d.me.color) + '"></i>公開前</span>' +
      '<span class="lg"><i class="lg-bonus"></i>ボーナス中</span>' +
      (Geo.pos ? '<span class="lg"><i class="lg-me"></i>現在地</span>' : '');
    pane.innerHTML = '<div class="section map-tall"><div class="map-legend">' + legend + '</div>' +
      '<div class="map-wrap"><div id="tMapSlot"></div>' +
      (Geo.pos && !outside ? '<button type="button" class="map-me" data-me aria-label="現在地へ">◎ 現在地</button>' : '') + '</div>' +
      '<p class="small muted map-note">' + (pub ? '<b class="mono">' + fmtTime(pub.at) + '</b> 時点の盤面。' : '') +
      (outside ? '<b>現在地は地図の外です。</b>' : '') +
      (radar ? 'チームの色の点は、レーダーで見えている最後の位置。' : '') +
      'ピンを押すと詳しく見られます。' +
      (placed.length < d.spots.length ? '（位置が未登録の陣地 ' + (d.spots.length - placed.length) + ' 件）' : '') + '</p></div>';
    renderMapArea(document.getElementById('tMapSlot'), T, placed.map(function (s) {
      var owner = s.mineSincePublish ? d.me : s.owner ? tm[s.owner] : null;
      return { id: s.id, pos: s.pos, icon: s.icon, color: owner ? owner.color : '', label: shortName(s.name), pending: s.mineSincePublish, bonus: s.bonus, requested: s.requested, hidden: s.hidden, area: s.area };
    }), { onTap: openSpotSheet, pinPx: 46, rerender: renderTeam, markers: teamMarkers(d) });
    // 初めて地図を開いたときは、現在地を真ん中にして少し拡大する
    if (Geo.pos && !outside && !T.mapCentered) {
      T.mapCentered = true;
      var z = zoneOf(Geo.pos);
      requestAnimationFrame(function () {
        requestAnimationFrame(function () { if (T.maps && T.maps[z.id]) T.maps[z.id].focus(Geo.pos, 2.4); });
      });
    }
  }

  /** 地図の「現在地」ボタン */
  function centerOnMe() {
    if (!Geo.pos) { toast('現在地がまだ分かりません', true); return; }
    if (!zoneOf(Geo.pos)) { toast('現在地は地図の外です', true); return; }
    focusSpot(T, Geo.pos, renderTeam, 2.4);
  }

  /** 陣地一覧の「地図」ボタン。地図タブに切り替えて、その陣地を真ん中に寄せる */
  function showOnMap(id) {
    var s = T.data.spots.find(function (x) { return x.id === id; });
    if (!s || !s.pos) return;
    T.tab = 'map';
    store.set('tab', T.tab);
    focusSpot(T, s.pos, renderTeam);
    window.scrollTo({ top: 0 });
  }

  /** 地図のピンを押したときの、陣地の詳細 */
  function openSpotSheet(id) {
    var d = T.data;
    var s = d && d.spots.find(function (x) { return x.id === id; });
    if (!s) return;
    var tm = teamMap(d.teams);
    var owner = ownerChip(s, tm, d.me);
    var link = walkLink(s);
    var secret = s.type === '秘密' && !s.capturedByMe;
    var dist = spotDist(s);
    openSheet(
      '<h2>' + esc(s.name) + '</h2>' +
      (dist !== null ? '<div class="dist-line">📍 ここから <b>' + esc(fmtDist(dist)) + '</b>・徒歩 約' + walkMin(dist) + '分</div>' : '') +
      (s.hidden && Geo.heat[s.id] != null ? '<div>' + heatPill(Geo.heat[s.id]) + '</div><div class="small muted">今いる場所から、本当の場所までの近さです（地図の「？」は本当の場所ではありません）</div>' : '') +
      '<div class="btn-row" style="align-items:center">' + (s.type !== '通常' ? '<span class="pill type-' + esc(s.type) + '">' + esc(s.type) + '</span>' : '') +
      '<span class="pill">' + s.pts + '点</span>' + (s.bonus ? '<span class="pill hl">ボーナス中</span>' : '') + owner +
      (s.requested ? '<span class="pill warn">申請中</span>' : '') + blockedPill(s) + (s.trapped ? '<span class="pill hl">トラップ</span>' : '') + '</div>' +
      (s.trapped ? '<div class="small muted">あなたのチームがトラップを仕掛けています。奪おうとしたチームから3点もらえます（相手には見えません）</div>' : '') +
      (s.blockedUntil > now() ? '<div class="small muted">封鎖カードで封鎖されています。封鎖が終わるまで、どのチームも申請できません</div>' : '') +
      (s.requested ? '<div class="small muted">この陣地はあなたのチームが申請していて、運営の確認待ちです</div>' : '') +
      (s.mission ? '<div><b>ミッション：</b>' + esc(s.mission) + '</div>' : '') +
      (s.hint ? '<div><b>ヒント' + (s.hintEarly ? '（先取り）' : '') + '：</b>' + esc(s.hint) + '</div>' : '') +
      '<div class="btn-row">' +
      (s.pos && MAP && T.tab !== 'map' ? '<button type="button" class="btn" data-sheetmap>地図で見る</button>' : '') +
      (secret ? '<button type="button" class="btn" data-taunt>道案内</button>'
        : link ? '<a class="btn" href="' + esc(link) + '" target="_blank" rel="noopener">道案内</a>' : '') +
      '</div>' +
      (outOfRoute(s, d)
        ? '<div class="small" style="color:var(--warn);font-weight:700">方面外の陣地です。あと <span data-countdown="' + d.me.route.until + '" data-mode="ms">' + fmtMS(d.me.route.until - now()) + '</span> で申請できるようになります（' + esc(d.me.route.label) + 'は今すぐ申請できます）</div>'
        : d.game.phase === 'playing' && !s.requested && !(s.blockedUntil > now()) && !(s.mineSincePublish || s.owner === d.me.id)
          ? '<button class="btn primary block" data-sheetcap="' + esc(s.id) + '">ここを申請する</button>' : '') +
      '<button class="btn block" data-close style="border-color:var(--line)">閉じる</button>'
    );
    var cap = modal.querySelector('[data-sheetcap]');
    if (cap) cap.onclick = function () { closeSheet(); openCapture(s.id); };
    var onmap = modal.querySelector('[data-sheetmap]');
    if (onmap) onmap.onclick = function () { closeSheet(); showOnMap(s.id); };
    var tauntBtn = modal.querySelector('[data-taunt]');
    if (tauntBtn) tauntBtn.onclick = taunt;
  }

  /** 時間で起きるイベント（ボーナス・ヒント・休憩など）を、チームとプロジェクターで共通の形にする */
  function feedEvent(f, big) {
    var ends = f.edge === 'end';
    if (f.type === '休憩') {
      return ends
        ? { kicker: '後半', title: '休憩終わり！ 後半スタート', tone: 'publish', big: true }
        : { kicker: '休憩', title: '休憩です', body: esc(f.text || '休憩中は占領できません'), tone: 'break', big: true };
    }
    if (f.type === 'ボーナス') {
      return ends
        ? { kicker: 'ボーナスタイム', title: 'ボーナスタイム終了', tone: 'info', big: false }
        : { kicker: 'ボーナスタイム', title: 'ボーナスタイム開始！', body: '対象：' + esc(f.targets.join('、')), plain: '対象：' + f.targets.join('、'), tone: 'bonus', big: big, hl: true };
    }
    if (f.type === 'ヒント') return { kicker: '秘密陣地', title: 'ヒント公開！', body: esc(f.text), plain: f.text, tone: 'alert', big: big, hl: true };
    if (f.type === 'ブラックアウト') {
      return ends
        ? { kicker: 'ブラックアウト', title: 'ブラックアウト終了', body: esc(f.text), plain: f.text, tone: 'info', big: false }
        : { kicker: 'ブラックアウト', title: 'ブラックアウト開始', body: 'ここから盤面は公開されません', plain: 'ここから盤面は公開されません', tone: 'alert', big: big };
    }
    return { kicker: 'お知らせ', title: f.text || 'お知らせ', tone: 'info', big: false };
  }
  function showFeedEvent(ev, auto) {
    if (ev.big) popup({ kicker: ev.kicker, title: ev.title, body: ev.body, band: ev.hl ? 'steal' : '', tone: ev.tone, auto: auto });
    else flash({ title: ev.title, body: ev.plain || '', hl: ev.hl, tone: ev.tone, secs: 7 });
  }

  function teamPopups(d) {
    var g = d.game, me = d.me, tm = teamMap(d.teams), items = [];
    if (!g.startedAt) { freshEvents('pop.' + T.teamId, []); return; }
    var start = g.startedAt;

    items.push({ key: 'start:' + start, at: start, show: function () {
      var rt = me.route;
      popup({ kicker: 'ゲーム開始', title: 'ゲームスタート！', tone: 'start',
        body: rt && rt.first
          ? '<div>最初の目的地は <b>「' + esc(rt.first.name) + '」</b></div><div class="small muted" style="margin-top:6px">開始から' + rt.min + '分は' + esc(rt.label) + 'の陣地だけ申請できます。目的地を取ると +' + rt.bonus + '点</div>'
          : '制限時間は ' + fmtClock(g.durationMin * 60000) + '。陣地を回って占領しよう' });
    } });

    d.notices.forEach(function (n) {
      var x = n.data || {};
      var key = 'n:' + start + ':' + (n.id || n.at + n.text);
      if (n.kind === 'capture') {
        var from = x.from ? tm[x.from] : null;
        items.push({ key: key, at: n.at, show: function () {
          popup({
            kicker: from ? '領地奪取' : '占領成功',
            band: from ? 'steal' : '',
            bandStyle: from ? '' : 'background:' + esc(me.color) + ';color:' + textOn(me.color),
            title: from ? from.name + 'から「' + x.spot + '」を奪った！' : '「' + x.spot + '」を占領！',
            body: '<div class="pop-num">+' + x.pts + '<small>点</small></div>' +
              (x.parts && x.parts.length ? '<div>' + esc(x.parts.join('・')) + '</div>' : '') +
              (x.card ? '<div class="line">' + (cardStars(x.card, T.data && T.data.game) >= 3 ? '<b class="rare-flash">レア！</b> ' : '') +
                'カードを手に入れた <span class="pill dark">' + esc(cardLabel(x.card, T.data && T.data.game)) + '</span></div>' : ''),
            tone: from ? 'steal' : 'success',
            fx: 'win', fxColor: me.color, // 火花は自分のチームの色
            sfx2: x.card && cardStars(x.card, T.data && T.data.game) >= 3 ? 'rare' : '', // ★★★のカードは鈴がきらきら
          });
        } });
      } else if (n.kind === 'reject') {
        items.push({ key: key, at: n.at, show: function () {
          popup({ kicker: '占領失敗', band: 'fail', title: '「' + x.spot + '」の申請は却下されました',
            body: '<div><b>理由：</b>' + esc(x.reason) + '</div><div class="small muted">写真を撮り直して、もう一度申請できます</div>', tone: 'fail' });
        } });
      } else if (n.kind === 'trap') {
        items.push({ key: key, at: n.at, show: function () {
          popup({ kicker: 'トラップ発動', band: 'steal', title: (tm[x.by] ? tm[x.by].name : '相手') + 'が「' + x.spot + '」のトラップにかかった！',
            body: '<div class="pop-num">+' + x.pts + '<small>点</small></div><div>陣地は守られました</div>', tone: 'success' });
        } });
      } else if (n.kind === 'robbed') {
        items.push({ key: key, at: n.at, show: function () {
          popup({ kicker: '強奪', band: 'steal', title: (tm[x.by] ? tm[x.by].name : '相手') + 'に「' + x.spot + '」を奪われた！',
            body: '<div>強奪カードを使われました。取り返すには、もう一度占領を申請してください</div>', tone: 'loss', fx: 'lose' });
        } });
      } else if (n.kind === 'swapped') {
        items.push({ key: key, at: n.at, show: function () {
          popup({ kicker: 'カード', title: (tm[x.by] ? tm[x.by].name : '相手') + 'に交換を使われた！',
            body: '「' + esc(x.lost) + '」を失い' + (x.got ? '、「' + esc(x.got) + '」を受け取りました' : 'ました'), tone: 'alert' });
        } });
      } else if (n.kind === 'announce') {
        items.push({ key: key, at: n.at, show: function () {
          popup({ kicker: '運営からのお知らせ', title: x.text, tone: 'alert' });
        } });
      } else if (n.kind === 'undo') {
        items.push({ key: key, at: n.at, show: function () {
          popup({ kicker: '取り消し', title: '「' + x.spot + '」の' + x.was + 'が取り消されました',
            body: '運営がもう一度確認しています。結果が出たら、またお知らせします', tone: 'alert' });
        } });
      } else if (n.kind === 'gift') {
        items.push({ key: key, at: n.at, show: function () {
          popup({ kicker: '運営から', title: 'カードのプレゼント！',
            body: (cardStars(x.card, T.data && T.data.game) >= 3 ? '<b class="rare-flash">レア！</b> ' : '') + '<span class="pill dark">' + esc(cardLabel(x.card, T.data && T.data.game)) + '</span>' +
              (x.reason ? '<div style="margin-top:8px">' + esc(x.reason) + '</div>' : '') + '<div class="small muted" style="margin-top:6px">「カード」タブから使えます</div>', tone: 'success' });
        } });
      } else if (n.kind === 'penalty') {
        items.push({ key: key, at: n.at, show: function () {
          popup({ kicker: 'ペナルティ', band: 'fail', title: '−' + x.pts + '点', body: esc(x.reason), tone: 'fail' });
        } });
      }
    });

    g.feed.forEach(function (f) {
      items.push({ key: 'f:' + start + ':' + f.id, at: f.at, show: function () { showFeedEvent(feedEvent(f, false)); } });
    });

    // 得点の公開。前回からの順位の上下と、奪われた陣地もここで知らせる
    var pub = d.published;
    var rankKey = 'rank.' + T.teamId;
    var mine = pub ? rankList(pub.scores, d.teams).find(function (x) { return x.team.id === me.id; }) : null;
    if (pub && pub.at - start > 5000) {
      var prevRank = store.get(rankKey);
      items.push({ key: 'p:' + pub.at, at: pub.at, show: function () {
        var delta = prevRank ? prevRank - mine.rank : 0;
        var losses = pub.losses || [];
        popup({
          kicker: '盤面公開',
          title: fmtTime(pub.at) + ' の盤面が公開されました',
          body: '<div class="line"><span class="pop-num">' + mine.rank + '<small>位</small></span>' +
            (delta > 0 ? '<span class="pill ok">↑' + delta + '</span>' : delta < 0 ? '<span class="pill bad">↓' + (-delta) + '</span>' : '') +
            '<span class="muted">' + mine.s.total + '点</span></div>',
          tone: 'publish',
        });
        if (losses.length) {
          popup({
            kicker: '領地損失',
            band: 'fail',
            title: losses.length === 1 ? '「' + losses[0].spot + '」を奪われた！' : losses.length + 'つの陣地を奪われた！',
            body: '<div class="small muted">前回の盤面公開のあとに奪われた陣地です</div>' + losses.map(function (l) {
              return '<div class="line">' + esc(l.spot) + ' → ' + chip(l.by ? tm[l.by] : null) + '</div>';
            }).join(''),
            tone: 'loss',
          });
        }
      } });
    }

    if (g.phase === 'ended') {
      items.push({ key: 'end:' + start, at: g.endsAt, show: function () {
        popup({ kicker: 'ゲーム終了', title: 'ゲーム終了！', body: '集合場所に戻って、結果発表を待とう', tone: 'publish' });
      } });
    } else if (g.endsAt) {
      [30, 10, 1].forEach(function (m) {
        if (g.endsAt - now() <= m * 60000) {
          items.push({ key: 'rem' + m + ':' + start, at: g.endsAt - m * 60000, show: function () {
            flash({ title: '残り' + m + '分！', hl: true, tone: 'clock' });
          } });
        }
      });
    }

    showFresh(freshEvents('pop.' + T.teamId, items));
    if (mine) store.set(rankKey, mine.rank);
  }

  function gameBanners(g) {
    var html = '';
    if (g.phase === 'waiting') html += '<div class="banner dark">ゲームの開始を待っています。始まると残り時間が動き出します。</div>';
    g.active.forEach(function (e) {
      var until = '<span class="mono" data-countdown="' + e.endsAt + '">' + fmtIn(e.endsAt) + '</span>';
      if (e.type === 'ボーナス') {
        html += '<div class="banner"><div><div>ボーナスタイム（' + until + '）</div><div class="sub">対象：' + esc(e.targets.join('、')) + '</div>' +
          (e.message ? '<div class="sub">' + esc(e.message) + '</div>' : '') + '</div></div>';
      } else if (e.type === '休憩') {
        html += '<div class="banner dark"><div><div>休憩中（' + until + '）</div><div class="sub">' + esc(e.message || '休憩中は占領できません') + '</div></div></div>';
      } else if (e.type === 'ブラックアウト') {
        html += '<div class="banner dark"><div><div>ブラックアウト中</div><div class="sub">' + esc(e.message || '盤面は公開されません') + '</div></div></div>';
      }
    });
    if (g.next) {
      html += '<div class="slim"><span class="muted">次のイベント</span><span class="grow">' + esc(g.next.type) + '</span><span class="mono" data-countdown="' + g.next.at + '">' + fmtIn(g.next.at) + '</span></div>';
    }
    return html;
  }

  function teamSpots(d, tm) {
    var g = d.game;
    var pub = d.published;
    var head = '<p class="small muted" style="margin:14px 0 0">' +
      (pub ? '盤面は <b class="mono">' + fmtTime(pub.at) + '</b> 時点。' : 'まだ盤面は公開されていません。') +
      (g.blackout ? 'ブラックアウト中は更新されません。' : g.nextPublishAt ? '次の公開は <span data-countdown="' + g.nextPublishAt + '">' + fmtIn(g.nextPublishAt) + '</span>。' : '') +
      '</p>';
    if (!d.spots.length) return head + '<div class="empty" style="margin-top:12px">陣地がまだ登録されていません</div>';
    Geo.drawnAt = Geo.pos;
    var near = T.sort === 'near' && !!Geo.pos;
    // 絞り込み：30か所から目的の陣地をすぐ探せるように（すべて・未占領・ほかのチーム・自陣）
    var me = d.me.id;
    var FILTERS = [
      ['all', 'すべて', function () { return true; }],
      ['free', '未占領', function (s) { return !s.owner && !s.mineSincePublish; }],
      ['enemy', '他チーム', function (s) { return s.owner && s.owner !== me && !s.mineSincePublish; }],
      ['mine', '自陣', function (s) { return s.mineSincePublish || s.owner === me; }],
    ];
    var fsel = FILTERS.find(function (f) { return f[0] === T.filter; }) || FILTERS[0];
    head += geoLine(g) + '<div class="filter-row" role="group" aria-label="絞り込み">' + FILTERS.map(function (f) {
      return '<button type="button" class="fchip" data-filter="' + f[0] + '" aria-pressed="' + (f === fsel) + '">' + f[1] + '<b>' + d.spots.filter(f[2]).length + '</b></button>';
    }).join('') + '</div>' + (Geo.pos
      ? '<div class="btn-row sort-row" role="group" aria-label="並べ方"><button type="button" class="btn sm" data-sort="area" aria-pressed="' + !near + '">エリア順</button>' +
        '<button type="button" class="btn sm" data-sort="near" aria-pressed="' + near + '">近い順</button></div>'
      : '');
    var list = d.spots.filter(fsel[2]);
    if (!list.length) return head + '<div class="empty" style="margin-top:12px">「' + fsel[1] + '」の陣地はありません</div>';
    // 秘密陣地のまとまりは、エリアの並びの途中ではなく最後に出す
    var groups;
    if (near) {
      // 近い順：距離が分かる陣地を近い順に。正体の分からないなぞの名所は、熱いものから最後にまとめる
      var known = list.filter(function (s) { return spotDist(s) !== null; });
      known.sort(function (a, b) { return spotDist(a) - spotDist(b); });
      var rest = list.filter(function (s) { return spotDist(s) === null; });
      rest.sort(function (a, b) { return (Geo.heat[b.id] == null ? -1 : Geo.heat[b.id]) - (Geo.heat[a.id] == null ? -1 : Geo.heat[a.id]); });
      groups = (known.length ? [{ key: '近い順', items: known }] : []).concat(rest.length ? [{ key: '距離が出ない陣地', items: rest }] : []);
    } else {
      groups = groupBy(list, areaKey);
      groups = groups.filter(function (g) { return g.key !== '秘密陣地'; }).concat(groups.filter(function (g) { return g.key === '秘密陣地'; }));
    }
    return head + groups.map(function (grp) {
      var suffix = !near && grp.key !== '秘密陣地' && grp.key !== 'その他' ? 'エリア' : '';
      return '<div class="section"><h3>' + esc(grp.key) + suffix + '</h3><div class="list">' +
        grp.items.map(function (s) { return spotRow(s, tm, d.me, near); }).join('') + '</div></div>';
    }).join('');
  }

  /** 陣地の一覧の上に出す、位置の状態の1行 */
  function geoLine(g) {
    if (!geoSupported() || g.phase === 'ended') return '';
    var consent = store.get('geo');
    if (consent === false) return '<p class="small muted geo-line">📍 現在地は使っていません <button type="button" class="linkish" data-geouse>使う</button></p>';
    if (consent !== true || Geo.err === 'denied') return '';
    if (!Geo.pos) return '<p class="small muted geo-line">📍 現在地を探しています…' + (Geo.err === 'unavailable' ? '（電波や GPS の都合で、まだ取れていません）' : '') + '</p>';
    return '<p class="small muted geo-line">📍 現在地から陣地までの距離を出しています（誤差 ±' + Geo.pos.acc + 'm・徒歩は直線の1.3倍で見積もり）' +
      (g.phase === 'playing' || g.phase === 'break' ? '' : '。位置を運営に送るのはゲームが始まってから') + '</p>';
  }

  function blockedPill(s) {
    if (!(s.blockedUntil > now())) return '';
    return '<span class="pill bad">封鎖中 <span data-countdown="' + s.blockedUntil + '">' + fmtIn(s.blockedUntil) + '</span></span>';
  }

  /** 持ち主の札。自分のチームの陣地は「自陣」と出して、ひと目で分かるようにする */
  function ownerChip(s, tm, me) {
    if (s.mineSincePublish || s.owner === me.id) {
      return '<span class="owner-chip mine" style="background:' + esc(me.color) + ';color:' + textOn(me.color) + '">自陣' + (s.mineSincePublish ? '（公開前）' : '') + '</span>';
    }
    return chip(s.owner ? tm[s.owner] : null);
  }

  /** 陣地の一覧の1行。行を押すと詳しい情報（地図・道案内・申請）が開く */
  function spotRow(s, tm, me, showArea) {
    var owner = s.owner ? tm[s.owner] : null;
    var mine = s.mineSincePublish || s.owner === me.id;
    var stripe = mine ? me.color : owner ? owner.color : '';
    var meta = [ownerChip(s, tm, me)];
    // 最初の目的地と、方面しばりの最中に方面の外にある陣地の印
    var route = T.data.me.route;
    var isTarget = route && route.first && route.first.id === s.id && !route.done;
    var out = outOfRoute(s, T.data);
    if (isTarget) meta.unshift('<span class="pill target">🧭 最初の目的地</span>');
    if (out) meta.push('<span class="pill">方面外</span>');
    var dist = spotDist(s);
    if (dist !== null) meta.push('<span class="dist">' + esc(distText(dist)) + '</span>');
    if (s.hidden && Geo.heat[s.id] != null) meta.push(heatPill(Geo.heat[s.id]));
    if (showArea && s.area && s.type !== '秘密') meta.push('<span class="pill">' + esc(s.area) + '</span>');
    if (s.type !== '通常') meta.push('<span class="pill type-' + esc(s.type) + '">' + esc(s.type) + '</span>');
    if (s.requested) meta.push('<span class="pill warn">申請中</span>');
    if (s.bonus) meta.push('<span class="pill hl">ボーナス中</span>');
    if (s.blockedUntil > now()) meta.push(blockedPill(s));
    if (s.trapped) meta.push('<span class="pill hl">トラップ</span>');
    // なぞの名所はヒントがいちばん大事なので、一覧にも出す（ミッションは詳しい画面で）
    var note = s.hint ? '<span class="note"><b>ヒント' + (s.hintEarly ? '（先取り）' : '') + '：</b>' + esc(s.hint) + '</span>' : '';
    return '<button type="button" class="spot' + (mine ? ' mine' : '') + (isTarget ? ' target' : '') + (out ? ' out' : '') + '" data-spot="' + esc(s.id) + '">' +
      '<span class="stripe"' + (stripe ? ' style="background:' + esc(stripe) + '"' : '') + '></span>' +
      '<span class="body"><span class="name">' + esc(s.name) + '</span><span class="meta">' + meta.join('') + '</span>' + note + '</span>' +
      '<span class="side"><span class="pts">' + s.pts + '<small>点</small></span><span class="chev" aria-hidden="true">›</span></span>' +
      '</button>';
  }

  /** カードの絵（トレカの真ん中に出す）と、ひとことの効果 */
  /** カードの紋（丸に一文字の家紋ふう）。絵文字をやめて、和の見た目にそろえる */
  var CARD_MON = { シールド: '守', ダブル: '倍', 偵察: '偵', 奇襲: '奇', 交換: '換', ヒント先取り: '先', 封鎖: '封', ボーナス: '点', 特大ボーナス: '宝',
    強奪: '奪', トラップ: '罠', フィーバー: '祭', レーダー: '探' };
  function cardMon(type) {
    return '<span class="art mon" aria-hidden="true"><span>' + esc(CARD_MON[type] || '札') + '</span></span>';
  }
  var CARD_SHORT = { シールド: '自陣を守る', ダブル: '点数がもう一回（申請と一緒に）', 偵察: '最新の盤面を見る', 奇襲: 'ロック中でも奪える（申請と一緒に）',
    交換: 'カードを入れ替える', ヒント先取り: 'ヒントを先に見る', 封鎖: '陣地を申請できなくする', ボーナス: 'すぐ1点', 特大ボーナス: 'すぐ5点',
    強奪: '陣地をその場で奪う', トラップ: '自陣にわなを仕掛ける', フィーバー: '点数2倍タイム', レーダー: 'ほかのチームの位置を見る' };

  /** 手持ちのカード。同じ種類はまとめて「×2」と出し、押すと説明と使うボタンが開く */
  function teamCards(d) {
    var g = d.game;
    if (!d.cards.length) return '<div class="empty" style="margin-top:16px">カードはまだありません。陣地の占領が承認されると、カードが手に入ることがあります。</div>';
    var groups = groupBy(d.cards, function (c) { return c.type; });
    groups.sort(function (a, b) { return cardStars(b.key, g) - cardStars(a.key, g); });
    return '<div class="section"><p class="small muted" style="margin:0 0 10px">カードを押すと、説明と使うボタンが出ます</p><div class="cards-grid tiles">' + groups.map(function (grp) {
      var n = cardStars(grp.key, g);
      var held = grp.items.filter(function (c) { return c.reserved; }).length;
      return '<button type="button" class="cardx tile r' + n + '" data-cardtype="' + esc(grp.key) + '">' +
        '<span class="stars" aria-label="レア度' + n + '">' + starText(n) + '</span>' +
        (grp.items.length > 1 ? '<span class="count">×' + grp.items.length + '</span>' : '') +
        cardMon(grp.key) +
        '<span class="title">' + esc(grp.key) + '</span>' +
        '<span class="desc">' + esc(CARD_SHORT[grp.key] || '') + '</span>' +
        (held ? '<span class="pill warn">' + held + '枚 申請で使用中</span>' : '') +
        '</button>';
    }).join('') + '</div></div>';
  }

  /** カードの詳しい画面（大きなカード・説明・使うボタン） */
  function openCardSheet(type) {
    var d = T.data;
    if (!d) return;
    var g = d.game;
    var list = d.cards.filter(function (c) { return c.type === type; });
    if (!list.length) return;
    var free = list.find(function (c) { return !c.reserved; });
    var n = cardStars(type, g);
    var sh = openSheet(
      '<div class="cardx big r' + n + '"><span class="stars">' + starText(n) + '</span>' + cardMon(type) +
      '<span class="title">' + esc(type) + (list.length > 1 ? ' <small>×' + list.length + '</small>' : '') + '</span></div>' +
      '<div>' + esc(CARD_DESC[type](g)) + '</div>' +
      '<div class="card-action">' + (free ? cardAction(free, d) : '<span class="pill warn">申請と一緒に使用中</span>') + '</div>' +
      '<button class="btn block" data-close style="border-color:var(--line)">閉じる</button>'
    );
    sh.addEventListener('click', function (e) {
      var u = e.target.closest('[data-use]');
      if (u) useCardButton(u, true);
    });
  }

  /** カードを使うための入力とボタン（選ぶものがあるカードは選択肢つき） */
  function cardAction(c, d) {
    var g = d.game;
    var mySpots = d.spots.filter(function (s) { return s.mineSincePublish || s.owner === d.me.id; });
    var others = d.teams.filter(function (t) { return t.id !== d.me.id; });
    var openSpots = d.spots.filter(function (s) { return !(s.blockedUntil > now()); });
    // 強奪できるのは、公開された盤面でほかのチームのものになっている陣地
    var robbable = d.spots.filter(function (s) { return s.owner && s.owner !== d.me.id && !s.mineSincePublish; });
    var tmap = teamMap(d.teams);
    var canUse = g.phase === 'playing' || g.phase === 'break';
    return (function () {
      var action = '';
      if (c.reserved) {
        action = '<span class="pill warn">申請と一緒に使用中</span>';
      } else if (c.type === 'シールド') {
        action = mySpots.length
          ? '<select id="sel-' + esc(c.id) + '" aria-label="守る陣地">' + mySpots.map(function (s) { return '<option value="' + esc(s.id) + '">' + esc(s.name) + '</option>'; }).join('') + '</select>' +
            '<button class="btn primary" data-use="' + esc(c.id) + '"' + (canUse ? '' : ' disabled') + '>この陣地を守る</button>'
          : '<span class="small muted">守れる自チームの陣地がまだありません</span>';
      } else if (c.type === '交換') {
        action = '<select id="sel-' + esc(c.id) + '" aria-label="交換する相手">' + others.map(function (t) { return '<option value="' + esc(t.id) + '">' + esc(t.name) + '</option>'; }).join('') + '</select>' +
          '<button class="btn primary" data-use="' + esc(c.id) + '"' + (canUse ? '' : ' disabled') + '>交換する</button>';
      } else if (c.type === '偵察') {
        action = '<button class="btn primary" data-use="' + esc(c.id) + '"' + (canUse ? '' : ' disabled') + '>偵察する</button>';
      } else if (c.type === 'ヒント先取り') {
        action = '<button class="btn primary" data-use="' + esc(c.id) + '"' + (canUse ? '' : ' disabled') + '>ヒントを見る</button>';
      } else if (c.type === '封鎖') {
        action = '<select id="sel-' + esc(c.id) + '" aria-label="封鎖する陣地">' + openSpots.map(function (s) { return '<option value="' + esc(s.id) + '">' + esc(s.name) + '</option>'; }).join('') + '</select>' +
          '<button class="btn primary" data-use="' + esc(c.id) + '"' + (canUse ? '' : ' disabled') + '>この陣地を封鎖する</button>';
      } else if (c.type === 'トラップ') {
        var trappable = mySpots.filter(function (s) { return !s.trapped; });
        action = trappable.length
          ? '<select id="sel-' + esc(c.id) + '" aria-label="トラップを仕掛ける陣地">' + trappable.map(function (s) { return '<option value="' + esc(s.id) + '">' + esc(s.name) + '（' + s.pts + '点）</option>'; }).join('') + '</select>' +
            '<button class="btn primary" data-use="' + esc(c.id) + '"' + (canUse ? '' : ' disabled') + '>トラップを仕掛ける</button>'
          : '<span class="small muted">トラップを仕掛けられる自チームの陣地がまだありません</span>';
      } else if (c.type === 'フィーバー') {
        action = '<button class="btn primary" data-use="' + esc(c.id) + '"' + (canUse ? '' : ' disabled') + '>' + (d.fever > now() ? 'フィーバーを延長する' : 'フィーバー開始') + '</button>';
      } else if (c.type === '強奪') {
        action = robbable.length
          ? '<select id="sel-' + esc(c.id) + '" aria-label="奪う陣地">' + robbable.map(function (s) {
              return '<option value="' + esc(s.id) + '">' + esc(s.name) + '（' + esc(tmap[s.owner] ? tmap[s.owner].name : '') + '・' + s.pts + '点）</option>';
            }).join('') + '</select>' +
            '<button class="btn primary" data-use="' + esc(c.id) + '"' + (canUse ? '' : ' disabled') + '>この陣地を奪う</button>'
          : '<span class="small muted">奪える陣地がまだありません（公開された盤面で、ほかのチームの陣地から選べます）</span>';
      } else if (c.type === 'レーダー') {
        action = '<button class="btn primary" data-use="' + esc(c.id) + '"' + (canUse ? '' : ' disabled') + '>' + (d.radar && d.radar.until > now() ? 'レーダーを延長する' : 'レーダーを使う') + '</button>';
      } else if (c.type === 'ボーナス' || c.type === '特大ボーナス') {
        action = '<button class="btn primary" data-use="' + esc(c.id) + '"' + (canUse ? '' : ' disabled') + '>' + (c.type === 'ボーナス' ? 1 : 5) + '点もらう</button>';
      } else {
        action = '<span class="small muted">「占領を申請する」で、申請と一緒に選べます</span>';
      }
      return action;
    })();
  }

  function onTeamPaneClick(e) {
    var row = e.target.closest('[data-spot]');
    if (row) { openSpotSheet(row.dataset.spot); return; }
    if (e.target.closest('[data-me]')) { centerOnMe(); return; }
    var tile = e.target.closest('[data-cardtype]');
    if (tile) { openCardSheet(tile.dataset.cardtype); return; }
    var cap = e.target.closest('[data-capture]');
    if (cap) { openCapture(cap.dataset.capture); return; }
    var onmap = e.target.closest('[data-onmap]');
    if (onmap) { showOnMap(onmap.dataset.onmap); return; }
    var sort = e.target.closest('[data-sort]');
    if (sort) { T.sort = sort.dataset.sort; store.set('sort', T.sort); renderTeam(); return; }
    var filt = e.target.closest('[data-filter]');
    if (filt) { T.filter = filt.dataset.filter; renderTeam(); return; }
    if (e.target.closest('[data-geouse]')) {
      store.set('geo', true);
      Geo.err = '';
      geoSync();
      renderTeam();
      return;
    }
    var use = e.target.closest('[data-use]');
    if (use) useCardButton(use, false);
  }

  /** カードの「使う」ボタン。1回目は確認、2回目で使う。カードの画面から使ったら、その画面を閉じる */
  function useCardButton(use, inSheet) {
    if (use.disabled) return;
    if (!armed(use, 'もう一度押すと使います')) return;
    var id = use.dataset.use;
    var sel = document.getElementById('sel-' + id);
    use.disabled = true;
    call('useCard', T.teamId, T.pin, id, sel ? sel.value : '').then(function (r) {
      if (inSheet && r.ok) closeSheet();
      toast(r.message, !r.ok);
      return teamPoll().then(function () {
        // レーダーは地図で見るので、地図タブに切り替える
        if (r.ok && r.radar && MAP) { T.tab = 'map'; store.set('tab', T.tab); renderTeam(); window.scrollTo({ top: 0 }); }
        else if (r.ok && T.data.scout && Date.now() - T.data.scout.at < 60000 && !sel) { T.tab = 'score'; renderTeam(); }
      });
    }).catch(function (err) {
      use.disabled = false;
      toast(err.message, true);
    });
  }

  function scoreBoard(scores, teams, me) {
    return '<div class="card">' + rankList(scores, teams).map(function (x) {
      var mine = me && x.team.id === me.id;
      return '<div class="rank' + (mine ? ' mine' : '') + '">' +
        '<div class="no">' + x.rank + '</div>' +
        '<div style="min-width:0">' + chip(x.team, mine ? '（自分）' : '') + '<div class="bd">' + breakdown(x.s) + (x.s.areas.length ? '（' + esc(x.s.areas.join('・')) + 'を制圧）' : '') + '</div></div>' +
        '<div class="total">' + x.s.total + '<small>点</small></div></div>';
    }).join('') + '</div>';
  }

  /**
   * 最初の目的地と方面の札。開始前と、方面しばりのあいだだけ出す。
   * 目的地までの距離・道案内・地図で見るを付けて、まずそこへ向かえるようにする
   */
  function routeBanner(d) {
    var r = d.me.route, g = d.game;
    if (!r || !r.min || g.phase === 'ended') return '';
    var waiting = !g.startedAt;
    if (!waiting && !routeActive(r, g)) return '';
    var f = r.first;
    var dist = f && f.pos && Geo.pos ? distM(Geo.pos, f.pos) : null;
    var link = f && f.pos ? walkLink({ pos: f.pos }) : '';
    return '<div class="route-card">' +
      '<div class="route-top"><span class="route-kicker">最初の目的地</span>' +
      (r.done ? '<span class="pill ok">✓ 占領済み（+' + r.bonus + '点）</span>' : r.bonus ? '<span class="pill dark">取ると +' + r.bonus + '点</span>' : '') + '</div>' +
      (f ? '<div class="route-name">' + esc(f.name) + (dist !== null ? '<small>' + esc(distText(dist)) + '</small>' : '') + '</div>' : '') +
      '<div class="route-rule"><b>' + esc(r.label) + '</b>　' + (waiting
        ? '開始から' + r.min + '分は、この方面の陣地だけ申請できます'
        : 'この方面の陣地だけ申請できます（あと <span class="mono" data-countdown="' + r.until + '" data-mode="ms">' + fmtMS(r.until - now()) + '</span>）') + '</div>' +
      (f && !r.done ? '<div class="btn-row">' + (link ? '<a class="btn sm" href="' + esc(link) + '" target="_blank" rel="noopener">道案内</a>' : '') +
        (f.pos && MAP ? '<button type="button" class="btn sm" data-onmap="' + esc(f.id) + '">地図で見る</button>' : '') + '</div>' : '') +
      '</div>';
  }

  /** 上のバーに出す、公開された盤面での自分の順位と点数（1位でなければ、上の順位まであと何点か） */
  function myRankHtml(d) {
    var pub = d.published;
    if (!pub || !d.game.startedAt) return '';
    var list = rankList(pub.scores, d.teams);
    var mine = list.find(function (x) { return x.team.id === d.me.id; });
    if (!mine) return '';
    var above = list.filter(function (x) { return x.s.total > mine.s.total; });
    var next = above.length ? above[above.length - 1] : null;
    return '<b>' + mine.rank + '</b><small>位</small><span class="sep">·</span><b class="pts-now">' + mine.s.total + '</b><small>点</small>' +
      (next ? '<span class="gap">' + (next.rank === 1 ? '首位' : next.rank + '位') + 'まで' + (next.s.total - mine.s.total) + '点</span>' : mine.rank === 1 ? '<span class="gap top">首位</span>' : '');
  }

  function teamScore(d, tm) {
    var html = '';
    var pub = d.published;
    var scout = d.scout && (!pub || d.scout.at > pub.at) ? d.scout : null;
    if (scout) {
      html += '<div class="section"><h2>偵察の結果（<span class="mono">' + fmtTime(scout.at) + '</span> 時点）</h2>' + scoreBoard(scout.scores, d.teams, d.me) +
        '<h3>陣地の持ち主</h3><div class="card"><div class="feed">' +
        d.spots.map(function (s) {
          return '<div class="feed-item" style="grid-template-columns:1fr auto"><div>' + esc(s.name) + '</div><div>' + chip(scout.owners[s.id] ? tm[scout.owners[s.id]] : null) + '</div></div>';
        }).join('') + '</div></div></div>';
    }
    html += '<div class="section"><h2>' + (pub ? '<span class="mono">' + fmtTime(pub.at) + '</span> 時点の得点' : '得点') + '</h2>' +
      (pub ? scoreBoard(pub.scores, d.teams, d.me) : '<div class="empty">ゲームが始まると表示されます</div>') +
      '<p class="small muted">得点は盤面の公開と同じタイミングで更新されます。ブラックアウト中は止まります。</p></div>';
    // 言葉と説明を2列の表にして、読み飛ばしやすくする
    var rules = [
      ['陣地', '終了時に持っている陣地の点数の合計'],
      ['ボーナス', '初占領・ボーナスタイム・ダブル・ボーナスカードで入る点。陣地を奪われても減りません'],
      ['エリア', '終了時に1つのエリアの陣地をすべて持っていると入る点（なぞの名所は数えません）'],
      ['なぞの名所', '見つけて占領すると5点。地図の「？」は本当の場所ではありません。ヒントを頼りに探そう'],
      ['ロック', '占領してから' + d.game.lockMin + '分間は奪い返されません'],
    ];
    if (d.me.route && d.me.route.min) {
      rules.push(['方面', '開始から' + d.me.route.min + '分は、自分の方面（' + d.me.route.label + '）の陣地だけ申請できます。最初の目的地を占領するとスタートボーナス +' + d.me.route.bonus + '点']);
    }
    html += '<div class="section"><h3>得点のしくみ</h3><dl class="rules card">' + rules.map(function (r) {
      return '<dt>' + esc(r[0]) + '</dt><dd>' + esc(r[1]) + '</dd>';
    }).join('') + '</dl></div>';
    return html;
  }

  function teamFeed(d) {
    var items = d.notices.map(function (n) { return { at: n.at, text: n.text, kind: 'me' }; })
      .concat(d.game.feed.filter(function (f) { return f.text; }).map(function (f) { return { at: f.at, text: f.text, kind: f.type }; }));
    items.sort(function (a, b) { return b.at - a.at; });
    return items;
  }

  /** 通知を受け取るかのお願い（まだ決めていないときだけ、ゲームが終わるまで） */
  function pushBanner(d) {
    if (pushAvail() !== 'ok' || d.game.phase === 'ended' || pushState(d.me.id) !== 'off' || store.get('push.later.' + d.me.id)) return '';
    if (Notification.permission === 'denied') return '';
    return askBanner('🔔', '通知を受け取る？', '画面を閉じていても、奪われた・承認・ボーナスタイム・残り時間が届きます',
      '<button type="button" class="btn sm primary" data-push="on">受け取る</button><button type="button" class="btn sm" data-push="later">あとで</button>');
  }
  /** お知らせタブの上の、通知の設定 */
  function pushSection(role, label) {
    var a = pushAvail();
    // 通知が使えないページ（Apps Script の URL など）では、欄ごと出さない
    if (a === 'no') return '';
    var html = '<div class="section"><h2>通知</h2><div class="card" style="padding:12px 14px;display:grid;gap:8px">';
    if (a === 'install') {
      html += '<div class="small">iPhone では、このページを<b>ホーム画面に追加</b>して、ホーム画面のアイコンから開くと通知が使えます（共有ボタン →「ホーム画面に追加」）。</div>';
    } else {
      var s = pushState(role);
      html += s === 'on'
        ? '<div>🔔 このスマホに' + esc(label) + 'の通知が届きます</div><div class="btn-row"><button type="button" class="btn sm" data-push="off">通知をやめる</button><button type="button" class="btn sm" data-push="on">登録し直す</button></div>'
        : s === 'denied'
          ? '<div class="small">通知がブロックされています。スマホの設定で、このアプリの通知を許可してから、もう一度押してください。</div><div class="btn-row"><button type="button" class="btn sm" data-push="on">もう一度試す</button></div>'
          : '<div class="small">' + esc(label) + 'の通知を、画面を閉じていてもこのスマホに届けます。</div><div class="btn-row"><button type="button" class="btn primary" data-push="on">通知を受け取る</button></div>';
    }
    return html + '</div></div>';
  }
  /** 通知と電波待ちの申請のボタン（チーム画面） */
  function onTeamExtraClick(e) {
    var p = e.target.closest('[data-push]');
    if (p) {
      var v = p.dataset.push;
      if (v === 'later') { store.set('push.later.' + T.teamId, true); renderTeam(); return; }
      if (v === 'off') { pushUnsubscribe(T.teamId).catch(function () {}).then(function () { toast('通知をやめました'); renderTeam(); }); return; }
      p.disabled = true;
      pushSubscribe(T.teamId, T.pin).then(function () {
        toast('通知を受け取ります');
      }).catch(function (err) {
        toast(err.message, true);
      }).then(function () { renderTeam(); });
      return;
    }
    // 上の「最初の目的地」の札の「地図で見る」
    var om = e.target.closest('#tBanners [data-onmap]');
    if (om) { showOnMap(om.dataset.onmap); return; }
    var o = e.target.closest('[data-outbox]');
    if (o) {
      if (o.dataset.outbox === 'send') { o.disabled = true; outboxFlush(); return; }
      if (!armed(o, '本当にやめる？')) return;
      var mine = Outbox.items.filter(function (x) { return x.team === T.teamId; });
      Promise.all(mine.map(function (x) { return Outbox.del(x.cid); })).then(function () { toast('預かっていた申請を消しました'); renderTeam(); });
    }
  }

  function teamNews(d, feed) {
    var st = { pending: ['確認待ち', 'warn'], approved: ['承認', 'ok'], rejected: ['却下', 'bad'] };
    var html = '<div class="section"><h2>申請の状況</h2>' + (d.requests.length
      ? '<div class="card"><div class="feed">' + d.requests.map(function (r) {
          var s = st[r.status];

  function readImage(file) {
    return new Promise(function (resolve, reject) {
      var fr = new FileReader();
      fr.onerror = function () { reject(new Error('写真を読み込めませんでした')); };
      fr.onload = function () {
        var img = new Image();
        img.onerror = function () { reject(new Error('この形式の写真は読み込めません。別の写真を選んでください')); };
        img.onload = function () {
          var max = 1280;
          var scale = Math.min(1, max / Math.max(img.naturalWidth, img.naturalHeight));
          var c = document.createElement('canvas');
          c.width = Math.round(img.naturalWidth * scale);
          c.height = Math.round(img.naturalHeight * scale);
          c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
          resolve(c.toDataURL('image/jpeg', 0.72));
        };
        img.src = fr.result;
      };
      fr.readAsDataURL(file);
    });
  }

  function openCapture(spotId) {
    var d = T.data;
    if (!d || d.game.phase !== 'playing') return;
    var usable = d.cards.filter(function (c) { return !c.reserved && (c.type === 'ダブル' || c.type === '奇襲'); });
    // 現在地が分かるときは、申請できる陣地のうち近い3つをボタンで出し、陣地を選ばずに開いたらいちばん近い陣地を選んでおく
    // 方面しばりの最中は、方面の外の陣地は選べないようにする
    var near = Geo.pos ? d.spots.filter(function (s) {
      return spotDist(s) !== null && !s.requested && !(s.blockedUntil > now()) && !(s.mineSincePublish || s.owner === d.me.id) && !outOfRoute(s, d);
    }).sort(function (a, b) { return spotDist(a) - spotDist(b); }).slice(0, 3) : [];
    var route = d.me.route;
    if (!spotId && near.length) spotId = near[0].id;
    // 現在地が分からなければ、まだ取っていない最初の目的地を選んでおく
    if (!spotId && route && route.first && !route.done && routeActive(route, d.game)) spotId = route.first.id;
    var options = groupBy(d.spots, areaKey).map(function (grp) {
      return '<optgroup label="' + esc(grp.key) + '">' + grp.items.map(function (s) {
        var off = s.requested || outOfRoute(s, d);
        return '<option value="' + esc(s.id) + '"' + (s.id === spotId ? ' selected' : '') + (off ? ' disabled' : '') + '>' + esc(s.name) + '（' + s.pts + '点）' +
          (s.requested ? '・申請中' : outOfRoute(s, d) ? '・方面外' : '') + '</option>';
      }).join('') + '</optgroup>';
    }).join('');
    var sh = openSheet(
      '<h2>占領を申請する</h2>' +
      (near.length ? '<div class="near-pick"><div class="small muted">近くの陣地</div><div class="near-chips">' + near.map(function (s) {
        return '<button type="button" class="near-chip" data-pick="' + esc(s.id) + '" aria-pressed="' + (s.id === spotId) + '"><b>' + esc(shortName(s.name)) + '</b><small>' + esc(fmtDist(spotDist(s))) + '・' + s.pts + '点</small></button>';
      }).join('') + '</div></div>' : '') +
      '<label class="field">陣地<select id="capSpot">' + options + '</select></label>' +
      '<div id="capInfo" class="small"></div>' +
      '<div class="btn-row" style="display:grid;grid-template-columns:1fr 1fr">' +
      '<label class="photo-drop" for="capCam">' + ICON.camera + '<span>カメラで撮る</span></label>' +
      '<label class="photo-drop" for="capLib">' + ICON.image + '<span>写真を選ぶ</span></label>' +
      '</div>' +
      '<input type="file" id="capCam" accept="image/*" capture="environment" hidden>' +
      '<input type="file" id="capLib" accept="image/*" hidden>' +
      '<div id="capPreview" hidden style="text-align:center"><img alt="送る写真" style="max-height:280px;border-radius:10px"></div>' +
      // 同じ種類のカードは1つにまとめる（同じ種類を2枚いっしょに使っても効き目は同じなので）
      (usable.length ? '<div style="display:grid;gap:8px"><div class="small muted">一緒に使うカード</div>' + groupBy(usable, function (c) { return c.type; }).map(function (grp) {
        var c = grp.items[0];
        return '<label class="check cap-card"><input type="checkbox" value="' + esc(c.id) + '" class="capCard">' + cardMon(c.type) + '<span style="min-width:0"><b>' + esc(cardLabel(c.type, d.game)) + '</b>' +
          (grp.items.length > 1 ? ' <span class="mono small muted">×' + grp.items.length + '</span>' : '') +
          '<span class="small muted" style="display:block;font-weight:500">' + esc(CARD_DESC[c.type](d.game)) + '</span></span></label>';
      }).join('') + '</div>' : '') +
      '<p class="small muted" style="margin:0">チーム全員と陣地の目印が写った写真を、<b>その陣地で</b>送ってください（申請した場所が運営に届きます）。占領は申請した時刻で記録されます。</p>' +
      '<p id="capErr" class="small" style="color:var(--bad);margin:0;font-weight:700" hidden></p>' +
      '<div class="btn-row"><button class="btn" data-close>やめる</button><button class="btn primary" id="capSend" style="flex:1" disabled>申請する</button></div>'
    );
    var photo = null;
    function info() {
      var s = d.spots.find(function (x) { return x.id === $('#capSpot', sh).value; });
      var html = '';
      if (s && s.mission) html += '<div><b>ミッション：</b>' + esc(s.mission) + '</div>';
      if (s && s.hint) html += '<div><b>ヒント：</b>' + esc(s.hint) + '</div>';
      if (s && s.bonus) html += '<div><span class="pill hl">ボーナス中</span></div>';
      $('#capInfo', sh).innerHTML = html;
      $$('[data-pick]', sh).forEach(function (b) { b.setAttribute('aria-pressed', String(b.dataset.pick === $('#capSpot', sh).value)); });
    }
    info();
    $('#capSpot', sh).onchange = info;
    $$('[data-pick]', sh).forEach(function (b) {
      b.onclick = function () { $('#capSpot', sh).value = b.dataset.pick; info(); };

    function onFile(e) {
      var f = e.target.files && e.target.files[0];
      if (!f) return;
      $('#capSend', sh).disabled = true;
      readImage(f).then(function (url) {
        photo = url;

        $('#capSend', sh).disabled = false;
        $('#capErr', sh).hidden = true;
      }).catch(function (err) {
        $('#capErr', sh).textContent = err.message;
        $('#capErr', sh).hidden = false;
      });
    }
    $('#capCam', sh).onchange = onFile;
    $('#capLib', sh).onchange = onFile;
    $('#capSend', sh).onclick = function () {
      var btn = this;
      btn.disabled = true;

      var cards = $$('.capCard', sh).filter(function (c) { return c.checked; }).map(function (c) { return c.value; });
      var spotId = $('#capSpot', sh).value;
      var spotObj = d.spots.find(function (x) { return x.id === spotId; });
      // 申請の目印。電波が切れて送り直しても、サーバーで二重にならない
      var item = { cid: deviceId() + '-' + Date.now().toString(36), team: T.teamId, spot: spotId, spotName: spotObj ? spotObj.name : spotId,
        photo: photo, cards: cards, loc: geoForCapture(), madeAt: now() };
      call('submitCapture', T.teamId, T.pin, item.spot, item.photo, item.cards, item.loc, { cid: item.cid }).then(function () {
        closeSheet();
        Sound.play('send');
        toast('申請しました。運営の確認を待っています');
        teamPoll();
      }).catch(function (err) {
        if (err.network) {
          // 電波がない：スマホに預かって、つながったら自動で送る
          Outbox.put(item).then(function () {
            closeSheet();
            popup({ kicker: '電波待ち', title: '申請を預かりました', body: '<div>電波がつながったら、自動で「' + esc(item.spotName) + '」の申請を送ります。アプリは開いたままにしておいてください。</div>' +
              '<div class="small muted" style="margin-top:6px">占領の時刻は、サーバーに届いた時刻で記録されます</div>', tone: 'alert' });
            renderTeam();
          }).catch(function () {
            btn.disabled = false;
            btn.textContent = '申請する';
            $('#capErr', sh).textContent = err.message + '（預かることもできませんでした）';
            $('#capErr', sh).hidden = false;
          });
          return;
        }
        btn.disabled = false;
        btn.textContent = '申請する';
        $('#capErr', sh).textContent = err.message;
        $('#capErr', sh).hidden = false;
      });
    };
  }

  // ───────── 運営画面 ─────────

  var A = null;
  var REJECT_REASONS = ['全員が写っていない', '目印が写っていない', 'ミッション未達成', '写真がよく見えない', 'その他'];

  function startAdminLogin() {

  /** プロジェクター画面を開くボタン（最初の画面から入口をなくしたので、運営画面から開く。別のタブで開く） */
  function projectorButton() {
    if (BOOT.baseUrl) {

  document.addEventListener('click', function (e) {

    if (!d.pinWarn || !d.pinWarn.length) return '';

  function startAdmin(pin) {
    document.body.classList.add('is-admin'); // 運営画面は作業用なので、動きは控えめに
    Bgm.setScope('admin'); // BGM は鳴らさない
    A = { pin: pin, data: null, tab: store.get('atab') || 'req', photos: {}, aiState: {}, aiDone: {}, sig: '' };
    app.innerHTML =
      '<header class="bar"><div class="wrap wide bar-in">' + homeButton() +
      '<div class="grow"><div class="team-name">運営</div><div class="btn-row" style="gap:4px;margin-top:4px"><span id="aPhase" style="display:contents"></span>' + soundButton() + projectorButton() + '</div></div>' +

      '</div></header>' +

  function adminPoll() {
    var mine = A;
    if (!mine) return Promise.resolve();
    return call('getAdminView', A.pin).then(function (d) {
      if (A !== mine) return; // 最初の画面に戻ったあとに届いた返事は使わない

      renderAdmin();
      adminPopups(d);
    }).catch(function (e) {
      if (e.auth) {
        store.del('admin');
        A.stop();
        toast(e.message, true);
        startHome();
      }
    });

  /** 新しい申請が来たら知らせる。開いた時点ですでにあった申請は知らせない */
  function adminPopups(d) {
    var tm = teamMap(d.teams);
    var pending = d.requests.filter(function (r) { return r.status === 'pending'; });
    if (!A.seenReq) {
      A.seenReq = {};
      pending.forEach(function (r) { A.seenReq[r.id] = true; });
      return;
    }
    pending.slice().reverse().forEach(function (r) {
      if (A.seenReq[r.id]) return;
      A.seenReq[r.id] = true;
      flash({ title: '新しい申請', body: (tm[r.team] ? tm[r.team].name : r.team) + ' → ' + spotName(d, r.spot), tone: 'alert', secs: 6 });
    });
    // 乗り物の疑いが新しく出たら知らせる（開いた時点ですでにあったものは知らせない）
    var first = !A.seenVeh;
    A.seenVeh = A.seenVeh || {};
    Object.keys(d.vehicles || {}).forEach(function (id) {
      var v = d.vehicles[id][0];
      if (!v || A.seenVeh[id + v.at]) return;
      A.seenVeh[id + v.at] = true;
      if (!first) flash({ title: '乗り物かも', body: (tm[id] ? tm[id].name : id) + '：時速' + v.kmh + 'kmで移動', tone: 'alert', secs: 8 });
    });
  }

  /** 運営の上に出す、乗り物の疑い（30分以内のもの）。自動では罰さないので、判断の材料だけ出す */
  function vehicleBanners(d) {
    var tm = teamMap(d.teams);
    return Object.keys(d.vehicles || {}).map(function (id) {
      var list = d.vehicles[id].filter(function (v) { return now() - v.at < 30 * 60000; });
      if (!list.length) return '';
      var top = Math.max.apply(null, list.map(function (v) { return v.kmh; }));
      return '<div class="banner veh-banner"><div><div>🚃 ' + esc(tm[id] ? tm[id].name : id) + '：乗り物かも（時速' + list[0].kmh + 'km・' + fmtAgo(list[0].at) + '）</div>' +
        '<div class="sub">位置から見た速さです（30分で' + list.length + '回・最高 時速' + top + 'km）。自動では罰しません。LINE で確認してから、必要なら「得点」タブでペナルティを付けてください</div></div></div>';
    }).join('');
  }

  function adminMarkers(d) {
    var tm = teamMap(d.teams);
    return Object.keys(d.locs || {}).filter(function (id) { return tm[id]; }).map(function (id) {
      var p = d.locs[id];

  /** 申請カードの「どこから申請したか」。自動では却下しない（街中は20〜50mずれる）ので、目安だけ出す */
  function locCheck(r, s) {
    if (!r.loc) return '<div class="loc-check none">📍 位置なし<span class="small muted">（位置を使っていない・取れなかった）</span></div>';
    if (r.locDist === null || r.locDist === undefined) return '<div class="loc-check none">📍 位置あり<span class="small muted">（陣地の位置が登録されていないので距離は出せません）</span></div>';
    var acc = r.loc.acc || 0;
    var ok = r.locDist <= Math.max(150, acc + 60);
    var age = r.loc.t ? Math.round((r.at - r.loc.t) / 60000) : 0;
    return '<div class="loc-check ' + (ok ? 'ok' : 'warn') + '">📍 ' + esc(shortName(s.name)) + 'から <b>' + esc(fmtDist(r.locDist)) + '</b> ' + (ok ? '✓' : '⚠ 離れています') +
      '<span class="small muted">（誤差±' + acc + 'm' + (age >= 2 ? '・申請の' + age + '分前の位置' : '') + '）</span></div>';
  }

  function adminDo(action, payload, btn) {
    if (btn) btn.disabled = true;
    return call('adminAction', A.pin, action, payload || {}).then(function (r) {
      var undoable = (action === 'approve' || action === 'reject') && payload && payload.id;
      toast(r.message, false, undoable ? { label: '元に戻す', fn: function () { adminDo('undo', { id: payload.id }); } } : null);
      A.sig = '';
      return adminPoll();
    }).catch(function (err) {
      if (btn) btn.disabled = false;
      toast(err.message, true);
    });
  }

  function renderAdmin() {
    var d = A.data;
    if (!d) return;
    var g = d.game;

    $('#aPhase').innerHTML = '<span class="pill ' + phase[1] + '">' + phase[0] + '</span>' + (g.blackout ? '<span class="pill dark">ブラックアウト</span>' : '') +

    var sig = A.tab + JSON.stringify([d.requests, d.live, d.scores, d.penalties, d.cards, g.phase, g.blackout, d.reveal, d.published && d.published.at, Math.floor(now() / 60000),

  function spotName(d, id) {

  function adminReq(d) {
    var tm = teamMap(d.teams);
    var pending = d.requests.filter(function (r) { return r.status === 'pending'; }).reverse();
    var done = d.requests.filter(function (r) { return r.status !== 'pending'; }).slice(0, 40);
    var html = '<div class="section"><h2>確認待ち（古い順）</h2>' +
      '<p class="small muted kbd-hint" style="margin:0 0 8px">キーボード：<b>A</b> いちばん上を承認　<b>R</b> 却下の理由を選ぶ（<b>1〜4</b> で理由）　<b>Esc</b> 閉じる</p>' +
      '<p class="small muted" style="margin:0 0 8px">📍 は申請したスマホの位置と陣地の距離です。街中は20〜50mずれるので目安にして、位置だけで却下はしないでください。</p>';

        '<div class="req-body">' +
        // 判定の順番（目印 → 人数 → ミッション）どおりに、見るものを並べる
        '<ol class="judge">' +
        '<li><span class="jk">目印</span><span>' + esc(s.landmark || s.name) + '</span></li>' +
        '<li><span class="jk">人数</span><span>' + (tm[r.team] && tm[r.team].size ? '<b>' + tm[r.team].size + '人</b>全員' : 'チーム全員') + '<span class="muted">（端で半分の人も数える）</span></span></li>' +
        (s.mission ? '<li><span class="jk">ミッション</span><span>' + esc(s.mission) + '</span></li>' : '') +
        '</ol>' +
        locCheck(r, s) +
        (r.madeAt ? '<div class="loc-check warn">📶 電波待ちで <b>' + Math.round((r.at - r.madeAt) / 60000) + '分</b>遅れて届いた申請（申請を押したのは ' + fmtTime(r.madeAt) + '）</div>' : '') +
        warn.map(function (w) { return '<div class="small" style="color:var(--warn);font-weight:700">' + esc(w) + '</div>'; }).join('') +
        aiPanel(d, r) +

        '<button class="btn ok" data-approve="' + esc(r.id) + '"' + (earlier ? ' disabled' : '') + '>承認する</button>' +

        '</div></div></div>';

    html += '<div class="section"><h2>処理済み（新しい順）</h2>' + (done.length ? '<div class="table-wrap"><table><thead><tr><th>申請</th><th>チーム</th><th>陣地</th><th>結果</th><th>理由・カード</th><th></th></tr></thead><tbody>' +
      done.map(function (r) {
        return '<tr><td class="mono">' + fmtTimeSec(r.at) + '</td><td>' + chip(tm[r.team]) + '</td><td>' + esc(spotName(d, r.spot)) + '</td>' +

  function loadPendingPhotos(d) {
    d.requests.filter(function (r) { return r.status === 'pending' && !A.photos[r.id]; }).forEach(function (r) {
      A.photos[r.id] = 'loading';
      call('getPhoto', A.pin, r.id).then(function (url) {
        A.photos[r.id] = url;
      }).catch(function () {
        A.photos[r.id] = 'error';
      }).then(function () {
        A.sig = '';
        renderAdmin();
      });
    });
  }

  /** 写真を AI に見せて、承認してよいかの助言をもらう。結果はサーバーに保存されるので、1枚につき1回だけ */
  function loadAdvice(d) {
    if (d.ai !== 'on') return;
    d.requests.filter(function (r) {
      return r.status === 'pending' && !r.ai && !A.aiDone[r.id] && !A.aiState[r.id];
    }).forEach(function (r) {
      A.aiState[r.id] = { status: 'loading' };
      call('getAdvice', A.pin, r.id).then(function (res) {
        if (res.status === 'done') {
          A.aiDone[r.id] = res.ai;
        } else if (res.status === 'running') {
          // ほかの運営画面が問い合わせ中。少し待ってから結果を取りに行く
          setTimeout(function () { delete A.aiState[r.id]; }, 8000);
        } else if (res.status === 'error') {
          A.aiState[r.id] = { status: 'error', message: res.message };
        }
      }).catch(function (err) {
        A.aiState[r.id] = { status: 'error', message: err.message };
      }).then(function () {
        A.sig = '';
        renderAdmin();
      });
    });
  }

  var AI_VERDICT = { approve: ['承認してよさそう', 'ok'], check: ['要確認', 'warn'], reject: ['却下をおすすめ', 'bad'] };

  function aiPanel(d, r) {
    // キーが入っていないときは、AIの欄ごと出さない
    if (d.ai !== 'on') return '';
    var ai = r.ai || A.aiDone[r.id];
    var stt = A.aiState[r.id];
    if (!ai) {
      if (stt && stt.status === 'error') {
        return '<div class="ai"><div class="ai-head"><span class="pill bad">AI</span><span>' + esc(stt.message) + '</span></div>' +
          '<button class="btn sm" data-airetry="' + esc(r.id) + '">もう一度AIに聞く</button></div>';
      }
      return '<div class="ai"><div class="ai-head"><span class="pill">AI</span><span class="muted">写真を確認しています…</span></div></div>';
    }
    var v = AI_VERDICT[ai.verdict] || AI_VERDICT.check;
    function row(label, ok, note) {
      return '<div class="ai-row"><span class="muted">' + label + '</span><span class="pill ' + (ok ? 'ok' : 'bad') + '">' + (ok ? 'OK' : 'NG') + '</span><span>' + esc(note) + '</span></div>';
    }
    return '<div class="ai">' +
      '<div class="ai-head"><span class="pill ' + v[1] + '">AI：' + v[0] + '</span></div>' +
      '<div>' + esc(ai.summary) + '</div>' +
      row('人数', ai.people.ok, ai.people.count + '人・' + ai.people.note) +
      row('目印', ai.landmark.ok, ai.landmark.note) +
      (ai.mission.required ? row('ミッション', ai.mission.ok, ai.mission.note) : '') +
      (ai.concerns && ai.concerns.length ? '<div class="small" style="color:var(--warn);font-weight:700">気になる点：' + esc(ai.concerns.join('／')) + '</div>' : '') +
      (ai.verdict === 'reject' && ai.reject_reason
        ? '<button class="btn sm danger" data-aireject="' + esc(r.id) + '" data-reason="' + esc(ai.reject_reason) + '">「' + esc(ai.reject_reason) + '」で却下する</button>'
        : '') +
      '<div class="small muted">AIの判定は参考です。最終判断は運営がしてください</div>' +
      '</div>';
  }

  function adminBoard(d) {
    var tm = teamMap(d.teams);
    var html = '<p class="small muted" style="margin:14px 0 0">今の本当の盤面です。チームに公開されているのは <b class="mono">' + fmtTime(d.published && d.published.at) + '</b> 時点のものです。</p>' +
      (MAP ? '<div class="section"><div id="aMapSlot"></div></div>' : '');

    html += '<div class="section"><h3>チームの現在地</h3><div class="table-wrap"><table><tbody>' + d.teams.map(function (t) {
      var p = (d.locs || {})[t.id];
      var stale = p && now() - p.t > 10 * 60000;
      return '<tr><td>' + chip(t) + '</td>' + (p
        ? '<td class="mono"' + (stale ? ' style="color:var(--warn);font-weight:700"' : '') + '>' + fmtAgo(p.t) + '</td><td class="small muted">誤差±' + (p.acc || 0) + 'm</td>' +
          '<td><a class="btn sm" href="https://www.google.com/maps/search/?api=1&amp;query=' + p.lat + ',' + p.lng + '" target="_blank" rel="noopener">Googleマップ</a></td>'

      '<p class="small muted" style="margin:6px 0 0">チーム画面を開いているスマホから、動いたときか1分ごとに届きます。10分以上届いていないチームは黄色で出ます。地図の点が各チームの最後の位置です。</p></div>';
    html += '<div class="section"><div class="table-wrap"><table><thead><tr><th>エリア</th><th>陣地</th><th>種類</th><th class="num">点</th><th>持ち主</th><th>ロック・封鎖</th><th>初占領</th><th>手動で直す</th></tr></thead><tbody>' +
      d.spots.map(function (s) {

        var trap = (d.traps || {})[s.id];

          '<td>' + chip(l.owner ? tm[l.owner] : null) + '</td><td class="mono">' + lockLeft + '</td><td>' + (l.first ? esc(tm[l.first] ? tm[l.first].name : l.first) : '') + '</td>' +
          '<td><div class="btn-row" style="flex-wrap:nowrap"><select id="own-' + esc(s.id) + '" style="min-height:34px;padding:4px 8px;width:auto"><option value="">持ち主なし</option>' +
          d.teams.map(function (t) { return '<option value="' + esc(t.id) + '"' + (l.owner === t.id ? ' selected' : '') + '>' + esc(t.name) + '</option>'; }).join('') +
          '</select><button class="btn sm" data-setowner="' + esc(s.id) + '">変更</button></div></td></tr>';
      }).join('') + '</tbody></table></div></div>';

  /** 運営の地図は、公開前の本当の持ち主で塗る */
  function adminMap(d) {

    renderMapArea(document.getElementById('aMapSlot'), A, d.spots.map(function (s) {
