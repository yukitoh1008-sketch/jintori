<base target="_top">
<meta charset="utf-8">
<meta name="theme-color" content="#0B0C10">
<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Shippori+Mincho+B1:wght@700;800&family=Dela+Gothic+One&family=IBM+Plex+Mono:wght@500;600&family=Zen+Kaku+Gothic+New:wght@400;500;700;900&display=swap">
<style>
/* 陣取りの地図：方眼紙の上に、チームの色で陣地を塗っていく */
:root {
  /* 和：墨の黒・金の線・和紙の文字。ネオン（--neon）は地図の陣地と演出にだけ使う */
  --paper: #0B0C10;      /* 墨：いちばん奥の背景 */
  --surface: #14161D;    /* カード・面 */
  --surface-2: #1E212B;  /* 区切り・押せる面 */
  --ink: #F2ECDD;        /* 和紙：本文の文字 */
  --muted: #B9B3A4;      /* 補足の文字 */
  --line: #2A2E3A;       /* ふつうの線 */
  --kin: #D9A94F;        /* 金：見出し・枠・押すボタン */
  --kin-line: #8A6B30;   /* 金の暗い線 */
  --on-kin: #1A1306;
  --neon: #3FD4FF;       /* ネオン：ボーナス・演出 */
  --neon-glow: 0 0 12px rgba(63, 212, 255, .35);
  --grid: rgba(217, 169, 79, .035);
  --primary: #D9A94F;
  --on-primary: #1A1306;
  --ok: #3FCB8E;
  --warn: #E6A640;
  --bad: #F2545B;
  --hl: #3FD4FF;
  --hl-ink: #04222C;
  --shadow: 0 1px 2px rgba(0, 0, 0, .5), 0 8px 28px rgba(0, 0, 0, .45);

  /* 地図：夜の街。陣地のマスだけがチームの色で光る */
  --map-bg: #07080C;
  --map-minor: #1B1E27;
  --map-case: #050609;
  --map-major: #262A35;
  --map-big: #3A3220;
  --map-green: #0E1B15;
  --map-green-edge: #16291F;
  --map-green-ink: #6FA88F;
  --map-water: #0C1E2C;
  --map-rail: #5B6170;
  --map-ink: #E8E1D0;
  --map-label: #8C877A;
  --icon-body: #23262F;
  --icon-red: #C8553D;
  --icon-green: #4E8A62;
  --icon-gold: #D9A94F;
  --icon-line: #D9A94F;  /* 名所アイコンの金の線 */
  --icon-ink: #12141B;   /* 名所アイコンの墨の地 */

  --f-display: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif; /* 数字・時計 */
  --f-head: "Shippori Mincho B1", "Hiragino Mincho ProN", "Yu Mincho", serif;    /* 見出し */
  --f-body: "Zen Kaku Gothic New", "Hiragino Sans", "Yu Gothic", "Meiryo", sans-serif;
  --f-mono: "IBM Plex Mono", ui-monospace, "SFMono-Regular", Menlo, monospace;
  color-scheme: dark;
}

* { box-sizing: border-box; }
html, body { margin: 0; }
body {
  background-color: var(--paper);
  background-image:
    linear-gradient(var(--grid) 1px, transparent 1px),
    linear-gradient(90deg, var(--grid) 1px, transparent 1px);
  background-size: 24px 24px;
  color: var(--ink);
  font: 500 15px/1.6 var(--f-body);
  -webkit-text-size-adjust: 100%;
  min-height: 100vh;
}
[hidden] { display: none !important; }
button, input, select, textarea { font: inherit; color: inherit; }
a { color: inherit; }
:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.mono { font-family: var(--f-mono); font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.small { font-size: 13px; }

.wrap {
  max-width: 760px;
  margin: 0 auto;
  padding-left: max(16px, env(safe-area-inset-left, 0px));
  padding-right: max(16px, env(safe-area-inset-right, 0px));
}

/* ── 上のバー ── */
.bar {
  position: sticky;
  top: 0;
  z-index: 20;
  background: var(--paper);
  border-bottom: 1px solid var(--kin-line);
  padding-top: env(safe-area-inset-top, 0px);
}
.bar-in { display: flex; align-items: center; gap: 12px; padding-block: 10px; }
.bar .grow { flex: 1; min-width: 0; }
.team-name { font-family: var(--f-head); font-weight: 800; letter-spacing: .04em; font-size: 15px; line-height: 1.2; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.clock { font-family: var(--f-display); font-weight: 800; font-size: 30px; line-height: 1; letter-spacing: .02em; font-variant-numeric: tabular-nums; }
.clock-label { font-size: 11px; color: var(--muted); letter-spacing: .08em; }
@media (max-width: 420px) { .clock { font-size: 24px; } .bar .pill { font-size: 11px; padding: 4px 7px; } }
.swatch { width: 14px; height: 40px; border-radius: 3px; flex: none; }

.pill {
  display: inline-flex; align-items: center; gap: 4px;
  font-size: 12px; font-weight: 700; line-height: 1;
  padding: 5px 8px; border-radius: 999px;
  border: 1px solid var(--line); background: var(--surface); white-space: nowrap;
}
.pill.ok { color: var(--ok); border-color: currentColor; }
.pill.warn { color: var(--warn); border-color: currentColor; }
.pill.bad { color: var(--bad); border-color: currentColor; }
.pill.hl { background: transparent; color: var(--neon); border-color: var(--neon); box-shadow: var(--neon-glow); }
.pill.dark { background: transparent; color: var(--kin); border-color: var(--kin); }

/* ── お知らせの帯 ── */
.banner {
  display: flex; gap: 10px; align-items: flex-start;
  padding: 10px 12px; border-radius: 6px; margin-top: 12px;
  background: rgba(63, 212, 255, .06); color: var(--neon); font-weight: 700;
  border: 1px solid var(--neon); box-shadow: var(--neon-glow), inset 0 0 10px rgba(63, 212, 255, .1);
}
.banner.dark { background: var(--surface); color: var(--ink); border-color: var(--kin-line); box-shadow: none; }
.banner .sub { font-weight: 500; font-size: 13px; color: var(--muted); }

/* ── タブ ── */
.tabs {
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; gap: 0;
  border-bottom: 1px solid var(--line); margin-top: 12px;
}
.tab {
  border: 0; border-bottom: 2px solid transparent; background: transparent; padding: 10px 2px 9px;
  font-weight: 700; font-size: 14px; cursor: pointer; position: relative; white-space: nowrap; color: var(--muted);
}
.tab[aria-selected="true"] { color: var(--kin); border-bottom-color: var(--kin); }
@media (max-width: 420px) { .tab { font-size: 13px; } }
.tab .dot { position: absolute; top: 6px; right: 10px; width: 8px; height: 8px; border-radius: 50%; background: var(--bad); }

.section { margin-top: 16px; }
.section h2 {
  font-family: var(--f-head); font-weight: 800; font-size: 18px; margin: 0 0 8px; color: var(--kin);
  letter-spacing: .06em; text-wrap: balance;
}
/* エリア名などの小見出し：金の明朝と、右へ伸びる金の細線 */
.section h3 { font-family: var(--f-head); font-size: 14px; color: var(--kin); letter-spacing: .12em; margin: 18px 0 8px; font-weight: 700;
  display: flex; align-items: center; gap: 10px; }
.section h3::after { content: ""; flex: 1; height: 1px; background: var(--kin-line); }

.card {
  background: var(--surface); border: 1px solid var(--line); border-radius: 12px;
}
.list { display: grid; gap: 8px; }

/* ── 陣地の行 ── */
.spot {
  display: grid; grid-template-columns: 4px 1fr auto; gap: 0 12px;
  background: var(--surface); border: 1px solid var(--line); border-radius: 8px; overflow: hidden;
}
.spot .stripe { background: var(--surface-2); }
.spot .body { padding: 10px 0; min-width: 0; }
.spot .side { padding: 10px 12px 10px 0; display: flex; flex-direction: column; align-items: flex-end; gap: 6px; }
.spot .name { font-weight: 700; line-height: 1.35; }
.spot .meta { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 4px; align-items: center; }
.spot .note { font-size: 13px; color: var(--muted); margin-top: 4px; }
.spot .pts { font-family: var(--f-display); font-weight: 800; font-size: 22px; line-height: 1; }
.spot .pts small { font-family: var(--f-body); font-size: 11px; font-weight: 700; margin-left: 1px; }
.owner-chip {
  display: inline-flex; align-items: center; gap: 4px; font-size: 12px; font-weight: 700;
  padding: 3px 8px; border-radius: 6px; line-height: 1.3;
}
.type-遠征 { color: var(--warn); border-color: currentColor; }
.type-ミッション { color: var(--kin); border-color: currentColor; }
.type-秘密 { background: transparent; color: #C79BFF; border-color: currentColor; }

/* ── ボタン ── */
.btn {
  display: inline-flex; align-items: center; justify-content: center; gap: 6px;
  min-height: 44px; padding: 0 16px; border-radius: 8px;
  border: 1px solid var(--kin-line); background: var(--surface); color: var(--ink);
  font-weight: 700; cursor: pointer; text-decoration: none; white-space: nowrap;
}
.btn.sm { min-height: 34px; padding: 0 12px; font-size: 13px; border-width: 1px; }
.btn.primary { background: var(--kin); color: var(--on-kin); border-color: var(--kin); font-weight: 900; letter-spacing: .08em; }
.btn.danger { border-color: var(--bad); color: var(--bad); }
.btn.ok { background: var(--ok); border-color: var(--ok); color: #04170E; font-weight: 900; }
.btn.block { width: 100%; }
.btn:disabled { opacity: .45; cursor: not-allowed; }
.btn-row { display: flex; flex-wrap: wrap; gap: 8px; }

.dock {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  background: var(--paper); border-top: 1px solid var(--kin-line);
  padding-bottom: max(10px, env(safe-area-inset-bottom, 0px));
}
.dock .wrap { padding-block: 10px 0; }
.dock .btn { min-height: 54px; font-size: 17px; }
.dock-space { height: 110px; }

/* ── フォーム ── */
label.field { display: grid; gap: 4px; font-weight: 700; font-size: 14px; }
select, input[type="text"], input[type="number"], input[type="password"], input[type="tel"] {
  width: 100%; min-height: 46px; padding: 8px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--surface);
}
select:focus, input:focus { border-color: var(--kin); outline: none; }
.check {
  display: flex; gap: 10px; align-items: center; padding: 10px 12px;
  border: 1.5px solid var(--line); border-radius: 10px; cursor: pointer; font-weight: 700;
}
.check input { width: 20px; height: 20px; }
.photo-drop {
  display: grid; place-items: center; gap: 6px; text-align: center;
  min-height: 150px; border: 2px dashed var(--line); border-radius: 12px; cursor: pointer;
  padding: 12px; font-weight: 700;
}
.photo-drop img { max-height: 260px; border-radius: 8px; }

/* ── 下から出るシート ── */
#modal {
  position: fixed; inset: 0; z-index: 50; display: grid; align-items: end;
  background: rgba(3, 4, 7, .72);
}
.sheet {
  background: var(--surface); border-top: 1px solid var(--kin-line); border-radius: 18px 18px 0 0; max-height: 92vh; overflow: auto;
  width: 100%; max-width: 640px; margin: 0 auto;
  padding: 18px max(16px, env(safe-area-inset-right, 0px)) max(20px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
  display: grid; gap: 14px;
}
.sheet h2 { font-family: var(--f-head); font-weight: 800; font-size: 21px; margin: 0; color: var(--kin); letter-spacing: .04em; }
@media (min-width: 700px) { #modal { align-items: center; } .sheet { border-radius: 18px; } }

#toast {
  position: fixed; left: 50%; transform: translateX(-50%); z-index: 60;
  bottom: calc(120px + env(safe-area-inset-bottom, 0px));
  background: var(--surface-2); color: var(--ink); padding: 10px 16px; border-radius: 8px; border: 1px solid var(--kin-line);
  font-weight: 700; max-width: calc(100% - 32px); box-shadow: var(--shadow); text-align: center;
}
#toast.bad { background: var(--bad); color: #fff; }
#toast { display: flex; align-items: center; gap: 12px; }
#toast[hidden] { display: none !important; }
.toast-act {
  border: 1.5px solid currentColor; background: transparent; color: inherit; border-radius: 8px;
  padding: 6px 10px; font-weight: 900; cursor: pointer; white-space: nowrap;
}
.kbd-hint { display: none; }
.btn .kbd-hint { margin-right: 8px; }
@media (hover: hover) and (pointer: fine) { .kbd-hint { display: initial; } p.kbd-hint { display: block; } }

/* ── 地図 ── */
.map-box {
  position: relative; overflow: hidden; border-radius: 14px; border: 1px solid var(--line);
  background: var(--map-bg); width: 100%; max-height: 72vh; touch-action: none; user-select: none;
}
.map-box svg { display: block; width: 100%; height: 100%; cursor: grab; }
.map-box svg:active { cursor: grabbing; }
.map-tools { position: absolute; right: 10px; top: 10px; display: grid; gap: 6px; }
.map-tools button {
  width: 40px; height: 40px; border-radius: 8px; border: 1px solid var(--kin-line);
  background: var(--surface); color: var(--kin); font: 900 18px var(--f-body); cursor: pointer; box-shadow: var(--shadow);
}
.map-tools button.wide { font-size: 11px; }
/* スマホでは拡大・縮小のボタンを地図の下に横並びにして、端のピンを隠さない */
@media (max-width: 600px) {
  .map-box:not(.overview) { overflow: visible; margin-bottom: 50px; }
  .map-box:not(.overview) .map-tools { top: calc(100% + 6px); right: 0; display: flex; }
  .map-box:not(.overview) .map-tools button { width: 44px; height: 38px; }
}
.map-note { margin: 8px 0 0; }
.screen:has(.screen-map) { height: 100vh; }
.screen-map { min-height: 0; height: 100%; }
.screen-map .map-box { height: 100%; max-height: none; aspect-ratio: auto !important; }
.m-bg { fill: var(--map-bg); }
.m-green path { fill: var(--map-green); stroke: var(--map-green-edge); stroke-width: 2; }
.m-water path { fill: var(--map-water); }
.m-river path { fill: none; stroke: var(--map-water); stroke-width: 14; stroke-linecap: round; }
.m-road path, .m-ped path { fill: none; stroke-linecap: round; stroke-linejoin: round; }
.m-road { stroke: var(--map-minor); }
.m-ped { stroke: var(--map-minor); stroke-width: 4; stroke-dasharray: 6 7; }
/* 名所のアイコンは「金蒔絵」：墨の地に金の線。色の面は金を薄く重ねるだけにして、家紋のアイコンとそろえる。
   チームの色は台座と旗だけに出るので、どのチームの陣地かが見分けやすい */
.m-lm .ic-b { fill: var(--icon-ink); stroke: var(--icon-line); stroke-width: 3; stroke-linejoin: round; }
.m-lm .ic-r { fill: rgba(217, 169, 79, .30); stroke: var(--icon-line); stroke-width: 3; stroke-linejoin: round; }
.m-lm .ic-g { fill: rgba(217, 169, 79, .14); stroke: var(--icon-line); stroke-width: 3; }
.m-lm .ic-y { fill: var(--icon-line); stroke: var(--icon-line); stroke-width: 2.5; }
.m-lm .ic-d { fill: var(--icon-line); }
.m-lm .ic-l { fill: none; stroke: var(--icon-line); stroke-width: 2.5; stroke-linecap: round; }
.m-lm-label { font: 900 19px var(--f-head); fill: var(--map-ink); paint-order: stroke; stroke: var(--map-bg); stroke-width: 6px; stroke-linejoin: round; }
.m-credit { font: 500 18px var(--f-body); fill: var(--map-label); }
.pin { cursor: pointer; }
.pin .hit { fill: transparent; }
.pin .plate { fill: var(--surface); stroke: var(--icon-line); stroke-width: 3; }
.pin .plate.empty { stroke: var(--kin-line); stroke-dasharray: 7 5; }
.pin .flag-pole { stroke: var(--icon-line); stroke-width: 4; stroke-linecap: round; }
.pin .flag { stroke: var(--icon-line); stroke-width: 3; stroke-linejoin: round; }
.pin .flag.pending { stroke-dasharray: 6 4; fill-opacity: .55; }
.pin .halo { fill: none; stroke: var(--hl); stroke-width: 10; opacity: .95; }
.pin-label { font: 900 28px var(--f-head); fill: var(--map-ink); paint-order: stroke; stroke: var(--map-bg); stroke-width: 6px; stroke-linejoin: round; pointer-events: none; }
.m-lm .ic-q { font: 400 50px var(--f-display); fill: var(--icon-line); }
@keyframes pin-pulse { 0%, 100% { opacity: .95; } 50% { opacity: .35; } }
.pin .halo { animation: pin-pulse 1.6s ease-in-out infinite; }
/* ゾーンの切り替えと全体図 */
.zone-chips { display: flex; gap: 6px; overflow-x: auto; padding-bottom: 8px; scrollbar-width: none; }
.zone-chip {
  flex: none; min-height: 36px; padding: 0 14px; border-radius: 999px; cursor: pointer;
  border: 1.5px solid var(--line); background: var(--surface); color: var(--ink); font-weight: 700;
}
.zone-chip[aria-selected="true"] { background: var(--primary); color: var(--on-primary); border-color: var(--primary); }
.on-screen .zone-chip { min-height: clamp(36px, 3vw, 56px); font-size: clamp(14px, 1.4vw, 24px); }
.map-box.overview { touch-action: auto; }
.map-box.overview svg { cursor: default; }
.screen-map .map-holder { height: 100%; min-height: 0; }
.screen-map { display: flex; flex-direction: column; }
.screen-map .map-holder { flex: 1; }
.ov-line { stroke-width: 70; stroke-linecap: round; opacity: .85; }
.ov-line.dashed { stroke-dasharray: 90 70; }
.ov-legend { list-style: none; margin: 8px 0 0; padding: 0; display: grid; gap: 4px; font-size: 13px; font-weight: 700; }
.ov-legend li { display: flex; align-items: center; gap: 8px; flex-wrap: wrap; }
.ov-swatch { width: 26px; height: 6px; border-radius: 3px; flex: none; }
.ov-swatch.dashed { background-image: linear-gradient(90deg, transparent 50%, var(--surface) 50%) !important; background-size: 8px 6px; }
.on-screen .ov-legend { font-size: clamp(13px, 1.2vw, 20px); grid-template-columns: repeat(2, minmax(0, 1fr)); }
.screen-map .ov-wrap { height: 100%; display: grid; grid-template-rows: minmax(0, 1fr) auto; }
.screen-map .ov-wrap .map-box { height: 100%; max-height: none; aspect-ratio: auto !important; }
.ov-zone { cursor: pointer; }
.ov-circle { fill: var(--surface); stroke: var(--map-ink); stroke-width: 16; }
.ov-circle.full { fill-opacity: .35; stroke-width: 34; }
.ov-dot { stroke: var(--map-ink); stroke-width: 12; }
.ov-dot.empty { fill: var(--surface); stroke-dasharray: 26 18; }
.ov-dot.pending { stroke-dasharray: 26 18; }
.ov-name { font: 900 210px var(--f-head); fill: var(--map-ink); }
.ov-count { font: 700 130px var(--f-mono); fill: var(--muted); }
.ov-base { font: 900 120px var(--f-head); fill: var(--warn); }
/* ゾーン地図の上の、メトロの駅と集合場所 */
.m-sta rect { fill: #00A7DB; stroke: var(--map-bg); stroke-width: 4; }
.m-sta text { font: 900 24px var(--f-body); fill: #fff; }
.m-sta .m-sta-label, .m-base .m-sta-label { font: 900 22px var(--f-head); fill: var(--map-ink); paint-order: stroke; stroke: var(--map-bg); stroke-width: 6px; stroke-linejoin: round; }
.m-base path { stroke: var(--map-ink); stroke-width: 4; fill: none; }
.m-base .flag { fill: var(--warn); stroke: var(--map-ink); stroke-width: 3; }
.m-lm .ic-k { font: 900 22px var(--f-head); fill: var(--icon-line); }
/* 陣地の範囲の外は土地を描かないので、地図の枠の地は無地にする */
.map-box.only-land { background: var(--surface); }
/* 六角形のマス目の陣地。マスの継ぎ目をうっすら見せて、盤面のように見せる */
.hexfill { fill: var(--map-ink); fill-opacity: .06; stroke: var(--map-bg); stroke-opacity: .55; stroke-width: 1.2; cursor: pointer; }
.hexfill.owned { fill-opacity: .42; }
.hexfill.pending { fill-opacity: .22; }
.hexedge { fill: none; stroke-linecap: round; stroke-linejoin: round; pointer-events: none; }
.hexedge.team { stroke-width: 5; filter: drop-shadow(0 0 7px currentColor); }
.hexedge.team.pending { stroke-dasharray: 8 6; }
.hexedge.inner { stroke-width: 2; stroke-opacity: .55; }
.hexedge.free { stroke: var(--map-ink); stroke-opacity: .4; stroke-width: 2.5; stroke-dasharray: 6 5; }
.hexedge.bonus { stroke: var(--neon); stroke-width: 6; filter: drop-shadow(0 0 6px var(--neon)); }
/* エリアの境目は、地図の大きさによらず画面上で同じ太さに */
.hexedge.area { stroke: var(--kin); stroke-opacity: .55; stroke-width: 3; stroke-dasharray: 9 5; vector-effect: non-scaling-stroke; }
.area-label { font-family: var(--f-head); font-weight: 700; fill: var(--kin); fill-opacity: .62; paint-order: stroke;
  stroke: var(--map-bg); stroke-opacity: .9; stroke-linejoin: round; pointer-events: none; letter-spacing: .04em; }
.no-area-label .area-label { display: none; }
.cell { fill: transparent; stroke: var(--map-ink); stroke-opacity: .3; stroke-width: 3; stroke-dasharray: 9 9; stroke-linejoin: round; cursor: pointer; }
.cell.owned { fill-opacity: .36; stroke-opacity: .95; stroke-width: 5; stroke-dasharray: none; }
.cell.owned.pending { fill-opacity: .18; stroke-dasharray: 14 8; }
.cell.bonus { stroke: var(--neon); stroke-opacity: 1; stroke-width: 7; stroke-dasharray: none; }
/* 全体表示では名所の名前を隠し、拡大したら出す */
.map-svg:not(.zoomed) .pin-label { display: none; }
.req-badge circle { fill: var(--warn); stroke: var(--surface); stroke-width: 1.5; }
.req-badge text { fill: #fff; font: 900 8px var(--f-body); text-anchor: middle; dominant-baseline: central; }

/* ── ポップアップ ── */
#pop {
  position: fixed; inset: 0; z-index: 70; display: grid; place-items: center;
  background: rgba(3, 4, 7, .78);
  padding: max(16px, env(safe-area-inset-top, 0px)) max(16px, env(safe-area-inset-right, 0px)) max(16px, env(safe-area-inset-bottom, 0px)) max(16px, env(safe-area-inset-left, 0px));
}
.pop-card {
  width: min(420px, 100%); background: var(--surface); color: var(--ink); border: 1px solid var(--kin-line);
  border-radius: 12px; overflow: hidden; box-shadow: var(--shadow);
  animation: pop-in .28s cubic-bezier(.2, 1.4, .4, 1);
}
.pop-band { padding: 12px 18px 4px; font-family: var(--f-head); font-weight: 800; font-size: 14px; letter-spacing: .3em; text-align: center;
  background: transparent; color: var(--kin); }
.pop-band.fail { color: var(--bad); text-shadow: 0 0 10px rgba(242, 84, 91, .6); }
.pop-band.steal { color: #FF6B72; text-shadow: 0 0 10px rgba(242, 84, 91, .8); }
.pop-main { padding: 18px 18px 16px; display: grid; gap: 12px; }
.pop-title { font-family: var(--f-head); font-weight: 800; font-size: 25px; line-height: 1.4; text-wrap: balance; text-align: center; color: #fff;
  text-shadow: 0 0 14px rgba(63, 212, 255, .35); }
.pop-num { font-family: var(--f-display); font-weight: 800; font-size: 52px; line-height: 1; text-align: center; color: var(--neon);
  text-shadow: 0 0 16px rgba(63, 212, 255, .6); }
.pop-num small { font-family: var(--f-body); font-size: 15px; font-weight: 700; margin-left: 4px; }
.pop-body { display: grid; gap: 6px; font-size: 15px; text-align: center; justify-items: center; }
.pop-body .line { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.pop-card .btn { min-height: 52px; font-size: 17px; }
@keyframes pop-in { from { transform: scale(.85); opacity: 0; } to { transform: none; opacity: 1; } }

#flash {
  position: fixed; z-index: 75; left: 50%; transform: translateX(-50%);
  top: calc(env(safe-area-inset-top, 0px) + 10px);
  width: min(520px, calc(100% - 32px));
  background: var(--surface); color: var(--ink); border-radius: 8px; border: 1px solid var(--kin-line);
  padding: 12px 16px; box-shadow: var(--shadow); cursor: pointer;
  animation: flash-in .3s ease-out;
}
#flash.hl { color: var(--neon); border-color: var(--neon); box-shadow: var(--neon-glow), var(--shadow); }
#flash .ft { font-weight: 900; font-size: 16px; }
#flash .fb { font-size: 13px; margin-top: 2px; }
@keyframes flash-in { from { transform: translate(-50%, -24px); opacity: 0; } to { transform: translateX(-50%); opacity: 1; } }

.sound-btn { cursor: pointer; }

/* プロジェクターでは大きく出す */
.on-screen .pop-card { width: min(1000px, 92vw); border-radius: 2vw; }
.on-screen .pop-band { font-size: clamp(14px, 1.6vw, 28px); padding: 1vw 2vw; }
.on-screen .pop-main { padding: 2.4vw; gap: 1.4vw; }
.on-screen .pop-title { font-size: clamp(28px, 4.4vw, 80px); }
.on-screen .pop-body { font-size: clamp(16px, 2vw, 36px); }
.on-screen .pop-body .owner-chip { font-size: clamp(14px, 1.6vw, 28px); padding: .2em .6em; }

/* ── 得点 ── */
.rank { display: grid; grid-template-columns: 34px 1fr auto; gap: 10px; align-items: center; padding: 10px 12px; }
.rank + .rank { border-top: 1px solid var(--line); }
.rank .no { font-family: var(--f-display); font-weight: 800; font-size: 20px; text-align: center; color: var(--kin); }
.rank .total { font-family: var(--f-display); font-weight: 800; font-size: 26px; line-height: 1; }
.rank .total small { font-family: var(--f-body); font-size: 12px; margin-left: 2px; }
.rank .bd { font-size: 12px; color: var(--muted); }

.feed { display: grid; }
.feed-item { display: grid; grid-template-columns: 52px 1fr; gap: 8px; padding: 10px 12px; }
.feed-item + .feed-item { border-top: 1px solid var(--line); }
.feed-item .t { font-family: var(--f-mono); font-size: 13px; color: var(--muted); }

.cardx {
  display: grid; gap: 8px; padding: 12px; background: var(--surface);
  border: 1px solid var(--line); border-radius: 8px;
}
.cardx .title { font-family: var(--f-head); font-weight: 800; font-size: 18px; line-height: 1.2; }
.cardx .desc { font-size: 13px; color: var(--muted); }
.cards-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 10px; }
/* カードのレア度。★が多いほど縁が目立つ */
.cardx .stars { font-size: 14px; letter-spacing: 2px; color: var(--muted); line-height: 1; }
.cardx.r2 { border-color: #4A86FF; }
.cardx.r2 .stars { color: #7FA8FF; }
.cardx.r3 { border: 1.5px solid var(--kin); box-shadow: 0 0 14px rgba(217, 169, 79, .35); }
.cardx.r3 .stars { color: var(--kin); }
.rare-flash { color: var(--kin); text-shadow: 0 0 10px rgba(217, 169, 79, .7); }

.empty { padding: 18px; text-align: center; color: var(--muted); border: 1.5px dashed var(--line); border-radius: 12px; }

/* ── ホーム・ログイン ── */
.hero { padding-block: 36px 8px; }
.hero h1 { font-family: var(--f-head); font-weight: 800; color: var(--kin); font-size: clamp(34px, 9vw, 56px); line-height: 1.05; margin: 0; letter-spacing: .01em; text-wrap: balance; }
.hero p { margin: 10px 0 0; color: var(--muted); }
/* 最初の画面：合言葉だけで入る */
.home { min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; padding-top: max(20px, env(safe-area-inset-top, 0px)); padding-bottom: max(18px, env(safe-area-inset-bottom, 0px)); }
.home > .grow { flex: 1; min-height: 16px; }
.home-brand { display: flex; align-items: center; gap: 10px; }
.home-brand img { width: 40px; height: 40px; border-radius: 10px; flex: none; }
.home-brand h1 { font-family: var(--f-head); font-weight: 800; color: var(--kin); font-size: 28px; line-height: 1.1; margin: 0; letter-spacing: .02em; }
.home-status { display: flex; align-items: center; gap: 10px; margin-top: 16px; padding: 10px 14px; border: 1px solid var(--line); border-radius: 12px; background: var(--surface); }
.hs-dot { width: 9px; height: 9px; border-radius: 50%; flex: none; background: var(--muted); }
.hs-dot.wait { background: var(--kin); }
.hs-dot.live { background: var(--ok); box-shadow: 0 0 8px var(--ok); animation: hs-blink 2s ease-in-out infinite; }
@keyframes hs-blink { 50% { opacity: .35; } }
.hs-t1 { font-weight: 700; font-size: 15px; line-height: 1.3; }
.hs-t2 { font-size: 13px; color: var(--muted); line-height: 1.4; }
.hs-clock { font-weight: 600; font-size: 22px; font-variant-numeric: tabular-nums; }
.home-resumes { display: grid; gap: 8px; margin-top: 12px; }
.home-resume { display: flex; align-items: center; gap: 10px; width: 100%; min-height: 52px; padding: 0 14px; border-radius: 12px; cursor: pointer;
  border: 1px solid var(--tc); background: color-mix(in srgb, var(--tc) 16%, var(--surface)); font-weight: 700; font-size: 16px; text-align: left; }
.home-resume .grow, .home-status .grow, .home-install .grow { flex: 1; min-width: 0; }
.home-resume .hr-dot { width: 12px; height: 12px; border-radius: 50%; background: var(--tc); flex: none; }
.home-pin { margin-top: 36px; text-align: center; }
.home-pin h2 { font-family: var(--f-head); font-weight: 800; font-size: 23px; margin: 0; letter-spacing: .02em; }
.home-pin > p { margin: 4px 0 0; }
.pin-boxes { position: relative; display: flex; justify-content: center; gap: 10px; margin: 20px auto 12px; width: fit-content; cursor: text; }
.pin-box { width: 58px; height: 70px; border-radius: 12px; border: 1px solid var(--line); background: var(--surface); display: grid; place-items: center;
  font-family: var(--f-mono); font-size: 30px; font-weight: 600; transition: border-color .15s, box-shadow .15s; }
.pin-box.filled { border: 2px solid var(--kin); }
.pin-box.cur { border: 2px solid var(--kin); box-shadow: 0 0 0 4px rgba(217, 169, 79, .18); }
/* 本物の入力欄は数字の枠の上に透明で重ねる（押すと数字のキーボードが出る） */
.pin-boxes input { position: absolute; inset: 0; width: 100%; height: 100%; opacity: 0; border: 0; font-size: 16px; color: transparent; caret-color: transparent; background: transparent; }
.home-pin.busy .pin-boxes { opacity: .5; }
.home-pin.shake .pin-boxes { animation: pin-shake .4s; }
.home-pin.shake .pin-box { border-color: var(--bad); }
@keyframes pin-shake { 20%, 60% { transform: translateX(-8px); } 40%, 80% { transform: translateX(8px); } }
.home-err { color: var(--bad); font-weight: 700; font-size: 14px; margin: 4px 0 0; }
.home-install { display: flex; gap: 10px; align-items: center; padding: 10px 12px; border-radius: 12px; border: 1px dashed var(--kin-line);
  background: rgba(217, 169, 79, .06); font-size: 13px; line-height: 1.5; margin-bottom: 12px; }
.home-install b { color: var(--kin); }
.home-install .sub { font-size: 12px; color: var(--muted); }
.home-install .hi-x { flex: none; width: 32px; height: 32px; border: 0; background: none; color: var(--muted); cursor: pointer; font-size: 15px; }
.home-help { margin: 0; padding-top: 12px; border-top: 1px solid var(--line); font-size: 13px; color: var(--muted); }
/* 合言葉が合ったとき：入るチームを大きく見せる */
.home-ok { position: relative; min-height: 100vh; min-height: 100dvh; display: flex; flex-direction: column; justify-content: center; align-items: center; text-align: center; padding-block: 24px; }
.home-ok .ok-glow { position: fixed; inset: 0; z-index: -1; pointer-events: none; }
.home-ok .ok-mark { width: 104px; height: 104px; border-radius: 50%; display: grid; place-items: center; font-family: var(--f-head); font-weight: 800; font-size: 48px;
  margin-bottom: 18px; animation: ok-pop .45s cubic-bezier(.2, 1.4, .4, 1) both; }
@keyframes ok-pop { from { transform: scale(.6); opacity: 0; } }
.home-ok p { margin: 0; }
.home-ok h1 { font-family: var(--f-head); font-weight: 800; font-size: 36px; line-height: 1.2; margin: 2px 0 0; }
.home-ok .ok-route { margin-top: 6px; }
.home-ok .ok-go { margin-top: 32px; min-height: 54px; font-size: 17px; max-width: 420px; }
.home-ok .ok-back { margin-top: 14px; border: 0; background: none; color: var(--muted); text-decoration: underline; text-underline-offset: 3px; font-size: 14px; cursor: pointer; padding: 8px; }
.pin-input { font-family: var(--f-mono); font-size: 28px !important; letter-spacing: .4em; text-align: center; }

/* ── 運営 ── */
.req {
  background: var(--surface); border: 1px solid var(--line); border-radius: 14px; overflow: hidden;
  display: grid; grid-template-columns: minmax(0, 1fr);
}
.req-head { display: flex; gap: 10px; align-items: center; padding: 10px 12px; flex-wrap: wrap; }
.req-photo { background: #000; display: grid; place-items: center; min-height: 160px; }
.req-photo img { max-height: min(420px, 50vh); width: auto; display: block; }
.req-photo .muted { color: #9AA3B6; }
.req-body { padding: 10px 12px; display: grid; gap: 8px; }
.ai { display: grid; gap: 6px; padding: 10px 12px; border: 1px solid var(--line); border-radius: 8px; background: var(--paper); }
.ai-head { display: flex; gap: 8px; align-items: center; flex-wrap: wrap; }
.ai-head .pill { font-size: 13px; }
.ai-row { display: grid; grid-template-columns: 72px 40px minmax(0, 1fr); gap: 6px; align-items: center; font-size: 14px; }
.ai-row .pill { justify-content: center; }
.decide { display: grid; grid-template-columns: 2fr 1fr; gap: 8px; }
.decide .btn { min-height: 54px; font-size: 17px; }
.reasons-list { display: grid; gap: 8px; }
.reasons-list .btn { min-height: 52px; font-size: 16px; }
@media (min-width: 900px) {
  .req { grid-template-columns: 340px minmax(0, 1fr); }
  .req-head { grid-column: 1 / -1; }
  .req-photo { grid-row: 2 / 4; }
}
.wrap.wide { max-width: 1100px; }
.table-wrap { overflow-x: auto; background: var(--surface); border: 1px solid var(--line); border-radius: 12px; }
table { border-collapse: collapse; width: 100%; font-size: 14px; }
th, td { text-align: left; padding: 8px 10px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { font-size: 12px; color: var(--muted); letter-spacing: .06em; }
tr:last-child td { border-bottom: 0; }
td.num, th.num { text-align: right; font-variant-numeric: tabular-nums; }
.form-row { display: flex; flex-wrap: wrap; gap: 8px; align-items: end; }
.form-row > * { flex: 1 1 140px; min-width: 0; }

/* ── プロジェクター ── */
.screen { min-height: 100vh; display: grid; grid-template-rows: auto 1fr auto; padding: 2.4vw max(2.4vw, 16px); gap: 2vw; }
.screen-head { display: flex; align-items: center; gap: 2vw; }
.screen-head h1 { font-family: var(--f-head); font-weight: 800; color: var(--kin); letter-spacing: .06em; font-size: clamp(22px, 3vw, 48px); margin: 0; flex: 1; }
.screen-clock { font-family: var(--f-display); font-weight: 800; font-size: clamp(36px, 6vw, 96px); line-height: 1; font-variant-numeric: tabular-nums; }
.screen-main { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1.6fr); gap: 2vw; min-height: 0; }
.screen-rank { display: grid; gap: 1vw; align-content: start; }
.screen-rank .row { display: grid; grid-template-columns: auto 1fr auto; align-items: center; gap: 1.2vw; padding: 1.2vw 1.4vw; border-radius: 1vw; }
.screen-rank .no { font-family: var(--f-display); font-weight: 800; font-size: clamp(20px, 2.6vw, 44px); }
.screen-rank .nm { font-weight: 700; font-size: clamp(16px, 2vw, 34px); }
.screen-rank .sc { font-family: var(--f-display); font-weight: 800; font-size: clamp(26px, 3.6vw, 64px); line-height: 1; }
.areas { display: grid; grid-template-columns: repeat(auto-fit, minmax(200px, 1fr)); gap: 1.2vw; align-content: start; }
.area h3 { margin: 0 0 .5vw; font-size: clamp(13px, 1.2vw, 20px); color: var(--muted); letter-spacing: .1em; }
.tiles { display: grid; grid-template-columns: repeat(auto-fill, minmax(min(100%, 120px), 1fr)); gap: .6vw; }
.tile { border-radius: .7vw; padding: .7vw .9vw; font-weight: 700; font-size: clamp(12px, 1.05vw, 18px); line-height: 1.3; min-height: 3.6vw; border: 1.5px solid var(--line); background: var(--surface); }
.screen-foot { color: var(--muted); font-size: clamp(12px, 1.1vw, 18px); }
.reveal { display: grid; gap: 1.4vw; align-content: center; max-width: 1200px; width: 100%; margin: 0 auto; }
.reveal .row { display: grid; grid-template-columns: 7vw 1fr auto; align-items: center; gap: 2vw; padding: 1.6vw 2vw; border-radius: 1.2vw; background: var(--surface); border: 1.5px solid var(--line); }
.reveal .no { font-family: var(--f-head); font-weight: 900; font-size: clamp(28px, 4vw, 72px); text-align: center; }
.reveal .nm { font-family: var(--f-head); font-weight: 900; font-size: clamp(22px, 3.2vw, 56px); }
.reveal .sc { font-family: var(--f-display); font-weight: 800; font-size: clamp(34px, 5vw, 92px); line-height: 1; }
.reveal .bd { font-size: clamp(12px, 1.2vw, 20px); color: var(--muted); font-weight: 700; }
.reveal .row.hidden .nm, .reveal .row.hidden .sc { color: var(--muted); }
@keyframes pop { from { transform: scale(.96); opacity: .4; } to { transform: none; opacity: 1; } }
.reveal .row.just { animation: pop .5s ease-out; }
/* 横長の地図1枚のときは、順位を上に横並び、地図を下に横いっぱい */
.screen-main.wide { grid-template-columns: minmax(0, 1fr); grid-template-rows: auto minmax(0, 1fr); gap: 1.4vw; }
.screen-main.wide .screen-rank { grid-auto-flow: column; grid-auto-columns: minmax(0, 1fr); }
.screen-main.wide .screen-rank .row { padding: .7vw 1.2vw; }
@media (max-width: 800px) { .screen-main { grid-template-columns: minmax(0, 1fr); } }
/* 秘密陣地の道案内を押したときの煽り（全画面） */
.taunt { position: fixed; inset: 0; z-index: 90; display: grid; place-items: center; padding: 16px; overflow: hidden; background: #c62a2f; }
.taunt::before { content: ""; position: absolute; left: 50%; top: 50%; width: 260vmax; height: 260vmax; margin: -130vmax 0 0 -130vmax;
  background: repeating-conic-gradient(#ffd23f 0 9deg, #e5484d 9deg 18deg); animation: taunt-spin 8s linear infinite; }
.taunt-card { position: relative; width: 100%; max-width: 440px; text-align: center; background: #111; color: #fff; border: 5px solid #ffd23f;
  border-radius: 22px; padding: 22px 20px 18px; box-shadow: 0 12px 0 #000; animation: taunt-slam .5s cubic-bezier(.2, 1.5, .4, 1) both, taunt-shake .5s .5s; }
.taunt-kicker { display: inline-block; background: #e5484d; color: #fff; font-weight: 900; font-size: 13px; letter-spacing: .08em; padding: 4px 12px; border-radius: 99px; margin-bottom: 14px; }
.taunt-title { font-family: var(--f-display); font-size: clamp(30px, 9vw, 50px); line-height: 1.25; color: #ffd23f; text-shadow: 4px 4px 0 #e5484d; word-break: keep-all; overflow-wrap: anywhere; }
.taunt-sub { margin-top: 12px; font-weight: 700; font-size: 16px; color: #ddd; }
.taunt-count { margin-top: 12px; font-size: 13px; color: #aaa; }
.taunt-count b { font-family: var(--f-display); font-size: 26px; color: #ff6b6b; }
.taunt-ok { margin-top: 18px; background: #ffd23f; color: #111; border-color: #ffd23f; font-weight: 900; }
.taunt-emo span { position: absolute; left: 50%; top: 50%; font-size: 44px; opacity: 0; animation: taunt-emo 1.4s ease-out both; }
@keyframes taunt-spin { to { transform: rotate(360deg); } }
@keyframes taunt-slam { 0% { transform: scale(3.2) rotate(-14deg); opacity: 0; } 60% { transform: scale(.92) rotate(3deg); opacity: 1; } 100% { transform: none; opacity: 1; } }
@keyframes taunt-shake { 0%, 100% { transform: none; } 20% { transform: translateX(-10px) rotate(-2deg); } 40% { transform: translateX(10px) rotate(2deg); } 60% { transform: translateX(-6px); } 80% { transform: translateX(6px); } }
@keyframes taunt-emo { 0% { transform: translate(-50%, -50%) scale(.3); opacity: 1; } 80% { opacity: 1; } 100% { transform: translate(calc(-50% + var(--dx)), calc(-50% + var(--dy))) rotate(var(--r)) scale(1.3); opacity: 0; } }
/* ── 位置情報 ── */
/* 地図の上の印。自分の現在地はネオンの点が波打つ。ほかのチームはチームの色の点と名前 */
.mk { pointer-events: none; }
.mk-acc { fill: var(--neon); fill-opacity: .08; stroke: var(--neon); stroke-opacity: .4; stroke-width: 1.5; vector-effect: non-scaling-stroke; pointer-events: none; }
.mk .mk-dot { stroke: #fff; stroke-width: 2.5; }

/* 陣地までの距離・なぞの名所の熱さ */

.heat-bar { display: inline-flex; gap: 2px; }
.heat-bar i { width: 5px; height: 10px; border-radius: 1px; background: var(--line); }
.heat.h1 .heat-bar i.on { background: #6FA8C9; }
.heat.h2 { color: var(--kin); border-color: var(--kin-line); }
.heat.h2 .heat-bar i.on { background: var(--kin); }
.heat.h3 { color: var(--warn); border-color: var(--warn); }
.heat.h3 .heat-bar i.on { background: var(--warn); }
.heat.h4 { color: var(--bad); border-color: var(--bad); }
.heat.h4 .heat-bar i.on { background: var(--bad); }
.geo-line { margin: 6px 0 0; }
.sort-row { margin-top: 8px; gap: 6px; }
.btn.sm[aria-pressed="true"] { background: var(--kin); color: var(--on-kin); border-color: var(--kin); }
.linkish { background: none; border: 0; padding: 0; color: var(--kin); font: inherit; font-weight: 700; text-decoration: underline; cursor: pointer; }
.banner.geo-ask, .banner.radar-banner { background: var(--surface); color: var(--ink); border-color: var(--neon); }
.banner.veh-banner { background: var(--surface); color: var(--ink); border-color: var(--warn); }
.banner.outbox-banner { background: var(--surface); color: var(--ink); border-color: var(--warn); }
/* 運営の申請カード：申請した位置と陣地の距離 */
.loc-check { padding: 4px 8px; border-radius: 6px; border: 1px solid var(--line); }
.loc-check.ok { border-color: var(--ok); }
.loc-check.warn { border-color: var(--warn); color: var(--warn); font-weight: 700; }
.loc-check.none { color: var(--muted); }
/* ── v1.35 見やすさの手直し ── */
/* 上のバー：順位・点数と、小さなスピーカー */
.bar-sub { display: flex; align-items: center; gap: 6px; margin-top: 4px; min-width: 0; flex-wrap: wrap; }

.my-rank b { font-size: 19px; font-weight: 800; }
.my-rank small { font-family: var(--f-body); font-size: 11px; font-weight: 700; }
.my-rank .sep { color: var(--kin-line); margin: 0 4px; }
.my-rank .gap { font-family: var(--f-body); font-size: 11px; font-weight: 700; color: var(--muted); margin-left: 6px; }
.my-rank .gap.top { color: var(--kin); }
.icon-btn { width: 30px; height: 26px; border-radius: 6px; border: 1px solid var(--line); background: var(--surface); font-size: 14px; line-height: 1; cursor: pointer; padding: 0; }
.icon-btn[aria-pressed="false"] { opacity: .6; }
/* タブは上のバーの下に固定して、スクロールしても切り替えられるように */
.tabs { position: sticky; top: var(--bar-h, 62px); z-index: 15; background: var(--paper); }
/* 1行の細い帯（次のイベント・確認待ち） */
.slim { display: flex; align-items: center; gap: 8px; margin-top: 8px; padding: 7px 12px; border-radius: 6px; font-size: 13px; font-weight: 700;
  background: var(--surface); border: 1px solid var(--line); min-width: 0; }
.slim .grow { flex: 1; min-width: 0; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.slim.warn { border-color: var(--warn); }
.slim.warn > span:first-child { color: var(--warn); white-space: nowrap; }
/* 小さなお願い（位置・通知） */
.ask { display: grid; grid-template-columns: auto 1fr; gap: 4px 10px; align-items: center; margin-top: 10px; padding: 10px 12px; border-radius: 8px;
  background: var(--surface); border: 1px solid var(--neon); box-shadow: var(--neon-glow); }
.ask-ic { font-size: 22px; grid-row: span 2; }
.ask-tx { display: grid; gap: 2px; min-width: 0; }
.ask-tx b { font-size: 14px; }
.ask-tx span { font-size: 12px; color: var(--muted); line-height: 1.45; }
.ask-btns { grid-column: 2; display: flex; gap: 6px; margin-top: 4px; }
/* 陣地の行：行全体を押すと詳しい画面。ボタンをなくして縦を詰める */
button.spot { width: 100%; text-align: left; color: inherit; font: inherit; cursor: pointer; padding: 0; }
button.spot:active { background: var(--surface-2); }
.spot .body { padding: 9px 0; display: grid; gap: 4px; }
.spot .name { display: block; }
.spot .meta { margin-top: 0; }
.spot .note { display: block; margin-top: 0; }
.spot .side { flex-direction: row; align-items: center; gap: 8px; padding: 0 10px 0 0; }
.spot .chev { color: var(--kin-line); font-size: 22px; line-height: 1; }
.spot.mine { border-color: var(--kin-line); background: linear-gradient(90deg, rgba(217, 169, 79, .07), var(--surface) 60%); }
.owner-chip.mine { font-weight: 900; letter-spacing: .04em; }
/* 申請画面：近くの陣地 */
.near-pick { display: grid; gap: 6px; }
.near-chips { display: grid; grid-template-columns: repeat(3, minmax(0, 1fr)); gap: 6px; }
.near-chip { display: grid; gap: 2px; padding: 8px 6px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface-2); color: var(--ink);
  font: inherit; cursor: pointer; text-align: center; min-width: 0; }
.near-chip b { font-size: 13px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.near-chip small { font-size: 11px; color: var(--muted); font-family: var(--f-mono); }
.near-chip[aria-pressed="true"] { border-color: var(--kin); background: rgba(217, 169, 79, .12); box-shadow: 0 0 0 1px var(--kin) inset; }
/* 地図タブ：画面いっぱいの地図・色の見本・現在地ボタン */
.map-legend { display: flex; flex-wrap: wrap; gap: 6px 12px; font-size: 12px; font-weight: 700; color: var(--muted); margin-bottom: 8px; }
.map-legend .lg { display: inline-flex; align-items: center; gap: 5px; }
.map-legend i { width: 12px; height: 12px; border-radius: 3px; display: inline-block; }
.map-legend .lg-pending { background: transparent; border: 2px dashed; }
.map-legend .lg-bonus { background: transparent; border: 2px solid var(--neon); box-shadow: var(--neon-glow); }
.map-legend .lg-me { border-radius: 50%; background: var(--neon); box-shadow: 0 0 6px var(--neon); }
.map-wrap { position: relative; }
.map-tall .map-box:not(.overview) { aspect-ratio: auto !important; max-height: none;
  height: calc(100vh - var(--bar-h, 62px) - 250px); height: calc(100dvh - var(--bar-h, 62px) - 250px); min-height: 300px; }
.map-me { position: absolute; left: 10px; top: 10px; z-index: 2; min-height: 36px; padding: 0 12px; border-radius: 8px; border: 1px solid var(--neon);
  background: rgba(11, 12, 16, .85); color: var(--neon); font-weight: 800; cursor: pointer; box-shadow: var(--neon-glow); }
.map-note { margin: 6px 0 0; }
/* 得点：自分のチームの行は金の帯（水色のベタ塗りをやめる） */
.rank.mine { background: rgba(217, 169, 79, .09); box-shadow: inset 4px 0 0 var(--kin); }
.rank.mine .total { color: var(--kin); }
/* カード：2列のトレカ。★の数で縁の色、★★★は金の光沢 */
.cards-grid.tiles { grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); }
@media (max-width: 420px) { .cards-grid.tiles { grid-template-columns: repeat(2, minmax(0, 1fr)); } }
.cardx.tile { position: relative; overflow: hidden; display: grid; justify-items: center; text-align: center; gap: 4px; padding: 12px 10px 14px;
  font: inherit; color: inherit; cursor: pointer; aspect-ratio: 3 / 4; align-content: center; }
.cardx .art { font-size: 40px; line-height: 1.1; filter: drop-shadow(0 4px 10px rgba(0, 0, 0, .5)); }
.cardx.tile .title { font-size: 17px; }
.cardx.tile .desc { font-size: 12px; line-height: 1.4; }
.cardx .count { position: absolute; top: 8px; right: 8px; font: 800 14px var(--f-mono); color: var(--on-kin); background: var(--kin); border-radius: 999px; padding: 2px 8px; }
.cardx.tile .stars { position: absolute; top: 10px; left: 10px; }
.cardx.r1 { border-color: #5B6170; background: linear-gradient(160deg, #1A1D26, var(--surface)); }
.cardx.r2 { background: linear-gradient(160deg, #142038, var(--surface)); box-shadow: 0 0 12px rgba(74, 134, 255, .18); }
.cardx.r3 { background: linear-gradient(160deg, #2A2112, var(--surface) 70%); }
.cardx.r3::after { content: ""; position: absolute; inset: 0; pointer-events: none;
  background: linear-gradient(115deg, transparent 30%, rgba(255, 228, 160, .22) 45%, transparent 60%); background-size: 250% 100%; animation: card-sheen 3.2s ease-in-out infinite; }
@keyframes card-sheen { from { background-position: 120% 0; } to { background-position: -120% 0; } }
.cardx.big { position: relative; overflow: hidden; display: grid; justify-items: center; gap: 6px; padding: 18px; text-align: center; }
.cardx.big .art { font-size: 56px; }
.cardx.big .title { font-size: 22px; }
.cardx.big .title small { font-family: var(--f-mono); font-size: 14px; color: var(--kin); }
.card-action { display: grid; gap: 8px; }
/* 運営の申請カード：判定の順番のチェック表 */
.judge { list-style: none; margin: 0; padding: 0; display: grid; gap: 4px; counter-reset: j; }
.judge li { display: grid; grid-template-columns: 92px 1fr; gap: 8px; align-items: baseline; padding: 5px 8px; border-radius: 6px; background: var(--surface-2); counter-increment: j; }
.judge .jk { font-weight: 800; color: var(--kin); font-size: 13px; }
.judge .jk::before { content: counter(j) ". "; color: var(--muted); }
/* プロジェクター：操作ボタンを隠し、次の公開・イベントまでを大きく */
.on-screen .map-tools { display: none; }
.screen-next { display: grid; justify-items: center; line-height: 1.1; padding: .3em .9em; border: 1px solid var(--kin-line); border-radius: 10px; background: var(--surface); }
.screen-next span { font-size: clamp(11px, 1vw, 18px); color: var(--muted); font-weight: 700; }
.screen-next b { font-family: var(--f-display); font-size: clamp(20px, 2.6vw, 44px); color: var(--kin); font-variant-numeric: tabular-nums; }
.on-screen .area-label { fill-opacity: .5; }
/* ── v1.37 アプリの基本構造（上・真ん中・下）にそろえる ── */
/* 下のメニュー：片手で押せるように画面の下に固定。真ん中は大きな申請ボタン */
.tabbar {
  position: fixed; left: 0; right: 0; bottom: 0; z-index: 25;
  display: grid; grid-auto-flow: column; grid-auto-columns: 1fr; align-items: end;
  background: rgba(11, 12, 16, .96); border-top: 1px solid var(--kin-line);
  padding: 4px max(6px, env(safe-area-inset-right, 0px)) max(6px, env(safe-area-inset-bottom, 0px)) max(6px, env(safe-area-inset-left, 0px));
  backdrop-filter: blur(8px);
}
.tabbar-space { height: 96px; }
.tb, .tb-cap { border: 0; background: transparent; color: var(--muted); font: inherit; cursor: pointer; display: grid; justify-items: center; gap: 2px; padding: 6px 0 2px; position: relative; }
.tb-label { font-size: 12px; font-weight: 700; letter-spacing: .04em; }
.tb-ic { position: relative; display: grid; place-items: center; width: 44px; height: 30px; border-radius: 15px; transition: background .15s; }
.tb[aria-selected="true"] { color: var(--kin); }
.tb[aria-selected="true"] .tb-ic { background: rgba(217, 169, 79, .16); }
.tb-badge { position: absolute; top: -4px; right: 0; min-width: 18px; height: 18px; padding: 0 5px; border-radius: 9px; background: var(--kin); color: var(--on-kin);
  font: 800 11px/18px var(--f-mono); }
.tb-cap { color: var(--kin); margin-top: -26px; }
.tb-cap-ring { width: 62px; height: 62px; border-radius: 50%; display: grid; place-items: center; background: var(--kin); color: var(--on-kin);
  border: 4px solid var(--paper); box-shadow: 0 0 0 1px var(--kin-line), 0 6px 18px rgba(0, 0, 0, .55), 0 0 18px rgba(217, 169, 79, .35); transition: transform .12s; }
.tb-cap:active .tb-cap-ring { transform: scale(.94); }
.tb-cap:disabled { cursor: not-allowed; color: var(--muted); }
.tb-cap:disabled .tb-cap-ring { background: var(--surface-2); color: var(--muted); box-shadow: 0 0 0 1px var(--line); }
/* 上のベル（お知らせ）。まだ見ていないお知らせがあると赤い点 */
.bell { position: relative; width: 40px; height: 40px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--ink); cursor: pointer;
  display: grid; place-items: center; flex: none; }
.bell[aria-pressed="true"] { color: var(--kin); border-color: var(--kin); }
.bell-dot { position: absolute; top: 6px; right: 7px; width: 9px; height: 9px; border-radius: 50%; background: var(--bad); box-shadow: 0 0 0 2px var(--surface); }
.bell-dot[hidden] { display: none; }
/* 左上の「最初の画面へ」ボタン */
.home-btn { flex: none; width: 36px; height: 36px; border-radius: 10px; border: 1px solid var(--line); background: var(--surface); color: var(--muted);
  display: grid; place-items: center; cursor: pointer; padding: 0; }
.home-btn:hover, .home-btn:active { color: var(--kin); border-color: var(--kin-line); }
.home-btn svg { width: 20px; height: 20px; }
.team-dot { display: inline-block; width: 10px; height: 10px; border-radius: 50%; margin-right: 6px; vertical-align: 1px; box-shadow: 0 0 0 2px var(--paper), 0 0 0 3px var(--line); }
/* 順位の行：幅が足りないときは「首位まで○点」だけを丸ごと次の行に回す（時計に重ねない） */
.bar-in > .grow { overflow: hidden; }
.my-rank { flex-wrap: wrap; row-gap: 2px; white-space: nowrap; }
.my-rank .gap { white-space: nowrap; }
.screen-head .home-btn { width: clamp(32px, 2.6vw, 44px); height: clamp(32px, 2.6vw, 44px); opacity: .55; }
.screen-head .home-btn:hover { opacity: 1; }
.set-row { display: flex; align-items: center; justify-content: space-between; gap: 12px; padding: 12px 14px; }
.set-row .icon-btn { width: 52px; height: 36px; font-size: 18px; }
/* タブを切り替えたときの動き */
.pane-in { animation: pane-in .22s ease-out; }
@keyframes pane-in { from { opacity: 0; transform: translateY(8px); } to { opacity: 1; transform: none; } }
/* 陣地の絞り込み */
.filter-row { display: flex; gap: 6px; margin-top: 10px; overflow-x: auto; scrollbar-width: none; }
.fchip { flex: none; display: inline-flex; align-items: center; gap: 6px; min-height: 34px; padding: 0 12px; border-radius: 999px; border: 1px solid var(--line);
  background: var(--surface); color: var(--ink); font: inherit; font-size: 13px; font-weight: 700; cursor: pointer; }
.fchip b { font-family: var(--f-mono); font-size: 12px; color: var(--muted); }
.fchip[aria-pressed="true"] { background: var(--kin); border-color: var(--kin); color: var(--on-kin); }
.fchip[aria-pressed="true"] b { color: var(--on-kin); }
/* 読み続けやすさ：小さい文字は12px以上に */
.clock-label, .my-rank small, .my-rank .gap, .near-chip small, .spot .pts small, .map-tools button.wide { font-size: 12px; }
/* 地図タブ：上のタブがなくなった分、地図を高く */
.map-tall .map-box:not(.overview) { height: calc(100vh - var(--bar-h, 62px) - 215px); height: calc(100dvh - var(--bar-h, 62px) - 215px); }
/* ── v1.39 方面と最初の目的地 ── */
.route-card { margin-top: 10px; padding: 12px 14px; border-radius: 10px; border: 1px solid var(--kin); background: linear-gradient(135deg, rgba(217, 169, 79, .12), var(--surface) 70%);
  display: grid; gap: 6px; }
.route-top { display: flex; align-items: center; justify-content: space-between; gap: 8px; }
.route-kicker { font-size: 12px; font-weight: 800; letter-spacing: .12em; color: var(--kin); }
.route-name { font-family: var(--f-head); font-weight: 800; font-size: 22px; line-height: 1.2; display: flex; align-items: baseline; flex-wrap: wrap; gap: 4px 10px; }
.route-name small { font-family: var(--f-mono); font-size: 13px; color: var(--muted); font-weight: 600; }
.route-rule { font-size: 13px; color: var(--muted); }
.route-rule b { color: var(--ink); }
.pill.target { color: var(--kin); border-color: var(--kin); background: rgba(217, 169, 79, .1); }
.spot.target { border-color: var(--kin); box-shadow: 0 0 0 1px var(--kin) inset; }
.spot.out { opacity: .5; }
/* 地図の最初の目的地：ピンの足もとに金の輪 */
.mk.target .mk-ring { fill: rgba(217, 169, 79, .15); stroke: var(--kin); stroke-width: 2.5; }
.mk.target .mk-ring2 { fill: none; stroke: var(--kin); stroke-width: 2; transform-box: fill-box; transform-origin: center; animation: mk-pulse 2.4s ease-out infinite; }
.target-label { fill: var(--kin); }
/* プロジェクター：残り時間の札が増えても、タイトルは1行のまま */
.screen-head h1 { white-space: nowrap; }
.screen-next { flex: none; padding: .25em .7em; }
/* ── v1.41 和×ネオンの見直し ──
   ふだんの画面は「和」：墨の黒・金の細い線・明朝の見出し。チームの色は細い線と点だけ。
   「ネオン」は光ってほしい瞬間だけ：地図で取ったマス・ボーナス・演出（奪った・入った）。 */

/* チームの札：色のベタ塗りをやめ、墨の地にチームの色の線と点（文字は和紙の色で読みやすく） */
.owner-chip { gap: 6px; border: 1px solid var(--tc); color: var(--ink); background: color-mix(in srgb, var(--tc) 16%, var(--surface)); }
.owner-chip .oc-dot { width: 7px; height: 7px; border-radius: 50%; background: var(--tc); flex: none; box-shadow: 0 0 6px var(--tc); }

/* 現在地のお願いは演出ではないので、ネオンではなく金の点線（ボーナスの帯と見分けがつくように） */
.banner.geo-ask, .ask { border: 1px dashed var(--kin-line); box-shadow: none; background: rgba(217, 169, 79, .05); color: var(--ink); }

/* 上のバー：金の細い線の下に、うっすら金の光 */
.bar { box-shadow: 0 1px 0 rgba(217, 169, 79, .08), 0 10px 24px -18px rgba(217, 169, 79, .5); }

/* 地図：取ったマスはチームの色で光る（マスの縁も色にして、ネオンの盤面に） */
.hexfill.owned { fill-opacity: .26; stroke-opacity: .7; stroke-width: 1.6; }
.hexfill.pending { fill-opacity: .12; stroke-opacity: .45; }
.hexedge.team { stroke-width: 4.5; filter: drop-shadow(0 0 4px currentColor) drop-shadow(0 0 10px currentColor); }
/* スマホの地図タブ：横長の地図が小さくならないように、枠を正方形くらいにする（縦長の枠で上下が空かないように） */
@media (max-width: 600px) and (orientation: portrait) {
  .map-tall .map-box:not(.overview) { height: auto; min-height: 0; aspect-ratio: 1 / 1 !important; }
}

/* カード：絵文字の代わりに「丸に一文字」の紋。★の数で紋と縁の色を変える（青はチームの色と紛れるので使わない） */
.cardx .art.mon { width: 64px; height: 64px; border-radius: 50%; display: grid; place-items: center; font-size: 0; filter: none;
  border: 2px solid var(--muted); box-shadow: inset 0 0 0 4px var(--surface), inset 0 0 0 5px rgba(185, 179, 164, .45); }
.cardx .art.mon span { font-family: var(--f-head); font-weight: 800; font-size: 30px; line-height: 1; color: var(--ink); }
.cardx.big .art.mon { width: 92px; height: 92px; }
.cardx.big .art.mon span { font-size: 44px; }
.cardx .title { color: var(--ink); }
.cardx.tile { aspect-ratio: auto; min-height: 196px; padding: 34px 10px 16px; gap: 6px; align-content: start; }
.cardx.r1 { border-color: var(--line); background: linear-gradient(160deg, #191B22, var(--surface)); box-shadow: none; }
.cardx.r2 { border-color: var(--kin-line); background: linear-gradient(160deg, #1D1A12, var(--surface)); box-shadow: none; }
.cardx.r2 .stars { color: var(--kin); }
.cardx.r2 .art.mon { border-color: var(--kin); box-shadow: inset 0 0 0 4px var(--surface), inset 0 0 0 5px var(--kin-line); }
.cardx.r2 .art.mon span { color: var(--kin); }
.cardx.r3 { border: 1.5px solid var(--kin); background: linear-gradient(160deg, #2A2112, var(--surface) 70%); box-shadow: 0 0 16px rgba(217, 169, 79, .3); }
.cardx.r3 .art.mon { border-color: var(--kin); background: radial-gradient(circle, #3A2C12, #1A1306 70%);
  box-shadow: inset 0 0 0 4px #1A1306, inset 0 0 0 5px var(--kin), 0 0 14px rgba(217, 169, 79, .55); }
.cardx.r3 .art.mon span { color: #FFE2A0; text-shadow: 0 0 10px rgba(217, 169, 79, .8); }
/* 申請画面の「一緒に使うカード」：小さな紋つき */
.check input { accent-color: var(--kin); flex: none; }
.check:has(input:checked) { border-color: var(--kin); background: rgba(217, 169, 79, .08); }
.cap-card .art.mon { width: 38px; height: 38px; flex: none; border: 1.5px solid var(--kin-line); border-radius: 50%; display: grid; place-items: center; }
.cap-card .art.mon span { font-family: var(--f-head); font-weight: 800; font-size: 18px; color: var(--kin); }

/* 得点のしくみ：言葉と説明の2列 */
.rules { margin: 0; padding: 12px 14px; display: grid; grid-template-columns: auto minmax(0, 1fr); gap: 8px 14px; font-size: 13px; line-height: 1.55; }
.rules dt { font-family: var(--f-head); font-weight: 800; color: var(--kin); white-space: nowrap; }
.rules dd { margin: 0; color: var(--ink); }

/* プロジェクターの順位：色のベタ塗りをやめ、墨の地にチームの色の線。1位だけ金の縁で光らせる */
.screen-rank .row { background: linear-gradient(90deg, color-mix(in srgb, var(--tc) 24%, var(--surface)), var(--surface) 75%);
  border: 1px solid color-mix(in srgb, var(--tc) 60%, transparent); box-shadow: inset .5vw 0 0 var(--tc); color: var(--ink); }
.screen-rank .row .no { color: var(--muted); }
.screen-rank .row .nm { font-family: var(--f-head); font-weight: 800; }
.screen-rank .row .sc { color: var(--ink); }
.screen-rank .row.top { border-color: var(--kin); box-shadow: inset .5vw 0 0 var(--tc), 0 0 1.4vw rgba(217, 169, 79, .35); }
.screen-rank .row.top .no, .screen-rank .row.top .sc { color: var(--kin); }
.tile.owned { background: color-mix(in srgb, var(--tc) 22%, var(--surface)); border-color: var(--tc); color: var(--ink); box-shadow: 0 0 .6vw color-mix(in srgb, var(--tc) 50%, transparent); }

/* 最初の画面：上に金の細い線。合言葉の枠は金の線 */
.home-brand { padding-bottom: 12px; border-bottom: 1px solid var(--kin-line); }
.home-brand h1 { letter-spacing: .08em; }
.home-status { margin-top: 14px; }
.home-pin h2 { letter-spacing: .06em; }
.pin-box { border-color: var(--kin-line); border-radius: 8px; }
.pin-box.cur { box-shadow: 0 0 0 4px rgba(217, 169, 79, .18), 0 0 14px rgba(217, 169, 79, .25); }
.home-resume { border-radius: 8px; }
/* 入るチームの確認：六角形の陣地がチームの色で光る（演出なのでネオン） */
.home-ok svg.ok-mark { width: 116px; height: 116px; background: none; border-radius: 0; overflow: visible; }
.home-ok .ok-hex { fill: color-mix(in srgb, var(--tc) 22%, var(--paper)); stroke: var(--tc); stroke-width: 4; filter: drop-shadow(0 0 6px var(--tc)) drop-shadow(0 0 16px var(--tc)); }
.home-ok .ok-ch { font-family: var(--f-head); font-weight: 800; font-size: 38px; fill: #fff; }
.home-ok h1 { letter-spacing: .06em; }

/* ── v1.42 動きのエフェクト ──
   電池を食わないように、動かすのは「位置（transform）」と「透明度（opacity）」だけ。光（影）は動かさず、光の層の透明度を変える。
   繰り返す動きの長さは 60 秒を割り切れる長さにし、--fxd（Js の FX_SYNC）で描き直しても途中から続くようにする。
   動きを止めたとき（設定でオフ・端末で「動きを減らす」）も、すべて普通に表示されるように、最初の見た目は keyframes の from に書く。 */
#app { position: relative; z-index: 1; }

/* A1 金粉：小さな金の粒が、ゆっくり上へ漂う。粒の模様の縦の長さ（210・140・168・120px）はどれも 840px を割り切るので、840px 動かすと継ぎ目なく繰り返せる */
#fx-dust { position: fixed; inset: 0; z-index: 0; pointer-events: none; overflow: hidden; }
/* 粒の模様を、横幅がばらばらの4枚ずつ重ねて、方眼にそろって見えないようにする */
#fx-dust::before, #fx-dust::after { content: ""; position: absolute; left: 0; right: 0; top: 0; height: calc(100% + 840px); will-change: transform;
  background-image:
    radial-gradient(circle, rgba(255, 226, 160, .8) 0 1.2px, transparent 2px),
    radial-gradient(circle, rgba(217, 169, 79, .7) 0 .8px, transparent 1.5px),
    radial-gradient(circle, rgba(255, 241, 200, .6) 0 1.5px, transparent 2.6px),
    radial-gradient(circle, rgba(217, 169, 79, .5) 0 .7px, transparent 1.3px);
  background-size: 257px 280px, 131px 168px, 389px 420px, 83px 120px;
  background-position: 17px 43px, 71px 9px, 203px 311px, 29px 77px;
  opacity: .45; animation: dust-rise 60s linear infinite; }
#fx-dust::after { background-size: 313px 210px, 173px 140px, 211px 840px, 97px 168px; background-position: 140px 99px, 7px 51px, 61px 600px, 50px 13px;
  opacity: .28; animation-duration: 120s; }
@keyframes dust-rise { from { transform: translateY(0); } to { transform: translateY(-840px); } }

/* A2 上のバーの金の線を、光がすっと走る（6秒に1回） */
.bar { overflow: clip; }
.bar::after { content: ""; position: absolute; left: 0; bottom: 0; width: 40%; height: 2px; pointer-events: none;
  background: linear-gradient(90deg, transparent, #FFE2A0 50%, transparent); opacity: 0; animation: bar-sweep 6s ease-in-out infinite; }
@keyframes bar-sweep { 0% { transform: translateX(-100%); opacity: 0; } 6% { opacity: 1; } 40% { transform: translateX(260%); opacity: 1; } 46%, 100% { transform: translateX(260%); opacity: 0; } }

/* A3 題字「陣取りバトル」に、金の光沢がすっと流れる（6秒に1回） */
.home-brand h1, .screen-head h1 { background: linear-gradient(100deg, var(--kin) 0 40%, #FFF1C8 50%, var(--kin) 60% 100%); background-size: 260% 100%;
  -webkit-background-clip: text; background-clip: text; color: transparent; animation: title-sheen 6s ease-in-out infinite; animation-delay: var(--fxd, 0s); }
@keyframes title-sheen { 0%, 50% { background-position: 100% 0; } 85%, 100% { background-position: 0 0; } }

/* A4 真ん中の申請ボタン：押せるときだけ、金の波紋が広がる（3秒に1回） */
.tb-cap-ring { position: relative; }
.tb-cap:not(:disabled) .tb-cap-ring::after { content: ""; position: absolute; inset: -2px; border-radius: 50%; border: 2px solid var(--kin); pointer-events: none;
  opacity: 0; animation: cap-ripple 3s ease-out infinite; animation-delay: var(--fxd, 0s); }
@keyframes cap-ripple { 0% { transform: scale(1); opacity: .85; } 70%, 100% { transform: scale(1.6); opacity: 0; } }

/* A5 ボーナスタイムの帯：ネオンがゆっくり呼吸する（4秒で1回）。光の層の透明度だけを変える */
.banner { position: relative; }
.banner:not(.dark):not(.veh-banner):not(.outbox-banner):not(.geo-ask)::after { content: ""; position: absolute; inset: -1px; border-radius: inherit; pointer-events: none;
  box-shadow: 0 0 20px rgba(63, 212, 255, .6), inset 0 0 16px rgba(63, 212, 255, .2); opacity: 0; animation: neon-breathe 4s ease-in-out infinite; animation-delay: var(--fxd, 0s); }
@keyframes neon-breathe { 0%, 100% { opacity: 0; } 50% { opacity: 1; } }

/* B1 押した瞬間に少し沈む */
.btn, .fchip, .zone-chip, .near-chip, .home-resume, .tb, .cardx.tile, button.spot, .check, .icon-btn, .map-tools button { transition: transform .12s ease; }
.btn:active:not(:disabled), .fchip:active, .zone-chip:active, .near-chip:active, .home-resume:active, .tb:active, .cardx.tile:active, .check:active, .icon-btn:active, .map-tools button:active { transform: scale(.96); }
button.spot:active { transform: scale(.985); }

/* B2 タブを切り替えたとき、行やカードが上から順にふわっと並ぶ */
.pane-in .spot, .pane-in .cardx.tile, .pane-in .rank, .pane-in .section > h3 { animation: fx-rise .45s cubic-bezier(.2, .8, .3, 1) both; }
.pane-in :nth-child(2).spot, .pane-in :nth-child(2).cardx, .pane-in :nth-child(2).rank { animation-delay: .04s; }
.pane-in :nth-child(3).spot, .pane-in :nth-child(3).cardx, .pane-in :nth-child(3).rank { animation-delay: .08s; }
.pane-in :nth-child(4).spot, .pane-in :nth-child(4).cardx, .pane-in :nth-child(4).rank { animation-delay: .12s; }
.pane-in :nth-child(5).spot, .pane-in :nth-child(5).cardx, .pane-in :nth-child(5).rank { animation-delay: .16s; }
.pane-in :nth-child(6).spot, .pane-in :nth-child(6).cardx, .pane-in :nth-child(6).rank { animation-delay: .2s; }
.pane-in :nth-child(n+7).spot, .pane-in :nth-child(n+7).cardx, .pane-in :nth-child(n+7).rank { animation-delay: .24s; }
@keyframes fx-rise { from { opacity: 0; transform: translateY(12px); } }

/* B3 上の点数が増えたら、金色に光る（数字はカウントアップ） */
.my-rank .pts-now { transition: color .5s, text-shadow .5s; }
.my-rank .pts-now.fx-up { color: #FFE2A0; text-shadow: 0 0 12px rgba(217, 169, 79, .9); }

/* C1 うれしいポップアップ：六角形の輪が広がり、火花が飛び散る */
.fx-burst { position: absolute; left: 50%; top: 50%; width: 0; height: 0; pointer-events: none; z-index: 3; }
.fx-ring { position: absolute; left: -60px; top: -60px; width: 120px; height: 120px; overflow: visible; opacity: 0; animation: fx-ring .9s cubic-bezier(.1, .7, .3, 1) both; }
.fx-ring.r2 { animation-duration: 1.2s; animation-delay: .14s; }
.fx-ring polygon { fill: none; stroke: var(--c); stroke-width: 3; filter: drop-shadow(0 0 6px var(--c)); }
@keyframes fx-ring { from { transform: scale(.2); opacity: 1; } to { transform: scale(3.4); opacity: 0; } }
.fx-burst i { position: absolute; left: -4px; top: -4px; width: 8px; height: 8px; border-radius: 2px; background: var(--c); box-shadow: 0 0 8px var(--c);
  opacity: 0; animation: fx-spark 1.05s cubic-bezier(.15, .8, .3, 1) both; }
@keyframes fx-spark { from { opacity: 1; transform: rotate(var(--a)) translateY(0) scale(1.2); } to { opacity: 0; transform: rotate(var(--a)) translateY(calc(var(--d) * -1)) scale(.3); } }
#pop.fx-win .pop-card { animation: pop-in .28s cubic-bezier(.2, 1.4, .4, 1), win-glow 1.4s ease-out; }
@keyframes win-glow { from { box-shadow: 0 0 0 1px var(--kin), 0 0 40px rgba(217, 169, 79, .55); } }

/* C2 悪い知らせ：画面のふちが赤く光り、カードがぶるっと揺れる */
#pop.fx-lose { animation: lose-flash 1s ease-out; }
@keyframes lose-flash { 20% { box-shadow: inset 0 0 140px 30px rgba(242, 84, 91, .5); } }
#pop.fx-lose .pop-card { border-color: var(--bad); animation: pop-in .28s cubic-bezier(.2, 1.4, .4, 1), fx-shake .5s .25s; }
@keyframes fx-shake { 15%, 55% { transform: translateX(-9px); } 35%, 75% { transform: translateX(9px); } }

/* C3 確認画面：六角形が線で描かれてから光り、文字が出る（そのあと火花） */
.home-ok .ok-hex { stroke-dasharray: 290; animation: hex-draw .6s ease-out both; }
@keyframes hex-draw { from { stroke-dashoffset: 290; fill-opacity: 0; } 70% { fill-opacity: 0; } }
.home-ok .ok-ch { animation: fx-fade .35s .45s both; }
@keyframes fx-fade { from { opacity: 0; } }
.home-ok svg.ok-mark { animation: none; }

/* C4 結果発表：墨の地にチームの色の線。1位は金の縁と光沢。1位が出た瞬間は紙吹雪（Js の fxConfetti） */
.reveal .row.shown { background: linear-gradient(90deg, color-mix(in srgb, var(--tc) 26%, var(--surface)), var(--surface) 80%);
  border-color: color-mix(in srgb, var(--tc) 65%, transparent); box-shadow: inset .6vw 0 0 var(--tc); color: var(--ink); }
.reveal .row.shown .no { color: var(--muted); }
.reveal .row.shown .bd { color: var(--muted); }
.reveal .row.r1 { position: relative; overflow: hidden; border-color: var(--kin); box-shadow: inset .6vw 0 0 var(--tc), 0 0 2.4vw rgba(217, 169, 79, .45); }
.reveal .row.r1 .no, .reveal .row.r1 .sc { color: var(--kin); }
.reveal .row.r1::after { content: ""; position: absolute; inset: 0; pointer-events: none; opacity: 0;
  background: linear-gradient(110deg, transparent 30%, rgba(255, 228, 160, .28) 48%, transparent 66%); animation: row-sheen 4s ease-in-out infinite; animation-delay: var(--fxd, 0s); }
@keyframes row-sheen { 0% { transform: translateX(-100%); opacity: 1; } 45% { transform: translateX(100%); opacity: 1; } 46%, 100% { transform: translateX(100%); opacity: 0; } }
.fx-confetti { position: fixed; inset: 0; z-index: 80; pointer-events: none; overflow: hidden; }
.fx-confetti i { position: absolute; top: -4vh; width: max(8px, .8vw); height: max(13px, 1.4vw); border-radius: 2px; background: var(--c); opacity: 0; animation: confetti-fall linear both; }
@keyframes confetti-fall { from { transform: translate(0, 0) rotate(0); opacity: 1; } to { transform: translate(var(--x), 112vh) rotate(var(--r)); opacity: .9; } }

/* ★★★のカードの光沢も、描き直しで最初に戻らないようにそろえる（3秒に1回） */
.cardx.r3::after { animation-duration: 3s; animation-delay: var(--fxd, 0s); }

/* 運営画面は作業用なので落ち着かせる（金粉とタブの切り替えだけ） */
.is-admin .bar::after, .is-admin .banner::after { display: none; }
/* エフェクトをオフにしたとき */
.fx-off #fx-dust, .fx-off .bar::after, .fx-off .tb-cap-ring::after, .fx-off .banner::after, .fx-off .reveal .row.r1::after { display: none; }
.fx-off .home-brand h1, .fx-off .screen-head h1, .fx-off .cardx.r3::after, .fx-off .pane-in * { animation: none !important; }

/* ── v1.43 効果音・BGM ── */
/* 録音のクレジット（魔王魂は表示が利用の条件） */
.sound-credit { display: block; margin-top: 4px; font-size: 11px; color: var(--muted); opacity: .8; }
.screen-foot .sound-credit { display: inline; float: right; margin: 0; font-size: clamp(11px, .9vw, 15px); }
/* BGM の音量（設定の行）：金のつまみ */
.bgm-vol { width: 100%; margin: 8px 0 0; accent-color: var(--kin); }
/* プロジェクター：1回クリックするまで音が出ないことの案内 */
.audio-hint { position: fixed; right: 16px; bottom: 16px; z-index: 60; padding: .5em 1em; border-radius: 999px; border: 1px solid var(--kin-line);
  background: rgba(11, 12, 16, .85); color: var(--kin); font-weight: 700; font-size: clamp(13px, 1.1vw, 18px); pointer-events: none; }

@media (prefers-reduced-motion: reduce) { * { animation: none !important; transition: none !important; } #fx-dust { display: none; } }
</style>

</head>

  // ───────── 地図 ─────────

  // ゾーンごとの地図（MAP_ZONES）と、ゾーンを路線でつないだ全体図（MAP_OVERVIEW）。

  /** 地図の上で、その陣地のゾーンに切り替えて真ん中に寄せる */

  /**
   * 全体図。ゾーンを丸で描き、路線でつなぐ。丸の中の点が陣地で、持ち主のチームの色で塗る。
   * 1つのゾーンを1チームが全部押さえると、丸がそのチームの色になる。
   * 拠点から見た向きは正確だが、距離は「近い」「遠い」の2段階にそろえて描く（路線図と同じで、形は正確ではない）。
   */
  function createOverview(onZone, big) {
    var O = OVERVIEW;
    var lat0 = O.zones[0].lat, lng0 = O.zones[0].lng;
    var mLat = 110950, mLng = 111412.84 * Math.cos(lat0 * Math.PI / 180);
    var pos = {}, R = 560;
    O.zones.forEach(function (z) {
      var dx = (z.lng - lng0) * mLng, dy = (lat0 - z.lat) * mLat;
      var d = Math.hypot(dx, dy);
      // 向きは本当の地図どおり、距離は「近いゾーン」「遠いゾーン」の2段階にそろえる
      var k = d ? (d < 3000 ? R * 2.7 : R * 4.2) / d : 0;
      pos[z.id] = { x: dx * k, y: dy * k };
    });
    var pad = R + 300;
    var xs = O.zones.map(function (z) { return pos[z.id].x; }), ys = O.zones.map(function (z) { return pos[z.id].y; });
    var minX = Math.min.apply(null, xs) - pad, minY = Math.min.apply(null, ys) - pad;
    var W = Math.max.apply(null, xs) + pad - minX, H = Math.max.apply(null, ys) + pad - minY;
    O.zones.forEach(function (z) { pos[z.id].x -= minX; pos[z.id].y -= minY; });

    var box = document.createElement('div');
    box.className = 'map-box overview' + (big ? ' big' : '');
    box.style.aspectRatio = W.toFixed(0) + ' / ' + H.toFixed(0);
    var lines = O.links.map(function (l) {
      var a = pos[l.from], b = pos[l.to];
      if (!a || !b) return '';
      return '<line x1="' + a.x.toFixed(0) + '" y1="' + a.y.toFixed(0) + '" x2="' + b.x.toFixed(0) + '" y2="' + b.y.toFixed(0) + '" class="ov-line' + (l.dashed ? ' dashed' : '') + '" style="stroke:' + esc(l.color) + '"/>';
    }).join('');
    // 路線と所要時間は、図の下に凡例として並べる（線の上に書くと、近いゾーンどうしで文字が丸に隠れるため）
    var names = {};
    O.zones.forEach(function (z) { names[z.id] = z.name; });
    var wrap = document.createElement('div');
    wrap.className = 'ov-wrap';
    wrap.appendChild(box);
    wrap.insertAdjacentHTML('beforeend', '<ul class="ov-legend">' + O.links.map(function (l) {
      return '<li><span class="ov-swatch' + (l.dashed ? ' dashed' : '') + '" style="background:' + esc(l.color) + '"></span>' +
        esc(names[l.from] + ' ↔ ' + names[l.to]) + '<span class="muted">　' + esc(l.label) + '</span></li>';
    }).join('') + '</ul>');
    box.innerHTML = '<svg class="map-svg" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 ' + W.toFixed(0) + ' ' + H.toFixed(0) + '" role="img" aria-label="全体図">' +
      '<rect class="m-bg" width="' + W.toFixed(0) + '" height="' + H.toFixed(0) + '"/>' + lines + '<g class="ov-zones"></g></svg>';
    var zonesG = box.querySelector('.ov-zones');
    box.addEventListener('click', function (e) {
      var g = e.target.closest('[data-ovzone]');
      if (g) onZone(g.getAttribute('data-ovzone'));
    });

    return {
      el: wrap,
      update: function (pins) {
        zonesG.innerHTML = O.zones.map(function (oz, zi) {
          var z = ZONES.find(function (x) { return x.id === oz.id; });
          var mine = z ? pins.filter(function (p) { return p.pos && inZone(z, p.pos); }) : [];
          var owners = mine.map(function (p) { return p.color; });
          var full = owners.length && owners[0] && owners.every(function (c) { return c === owners[0]; }) ? owners[0] : '';
          var c = pos[oz.id];
          var dots = mine.map(function (p, i) {
            var t = -Math.PI / 2 + (i / mine.length) * Math.PI * 2;
            var x = c.x + Math.cos(t) * (R - 130), y = c.y + Math.sin(t) * (R - 130);
            return '<circle class="ov-dot' + (p.color ? '' : ' empty') + (p.pending ? ' pending' : '') + '" cx="' + x.toFixed(0) + '" cy="' + y.toFixed(0) + '" r="78"' + (p.color ? ' style="fill:' + esc(p.color) + '"' : '') + '/>';
          }).join('');
          var taken = owners.filter(Boolean).length;
          return '<g class="ov-zone" data-ovzone="' + esc(oz.id) + '">' +
            '<circle class="ov-circle' + (full ? ' full' : '') + '" cx="' + c.x.toFixed(0) + '" cy="' + c.y.toFixed(0) + '" r="' + R + '"' + (full ? ' style="fill:' + esc(full) + ';stroke:' + esc(full) + '"' : '') + '/>' +
            dots +
            '<text class="ov-name" x="' + c.x.toFixed(0) + '" y="' + (c.y + 30).toFixed(0) + '" text-anchor="middle">' + esc(oz.name) + '</text>' +
            '<text class="ov-count" x="' + c.x.toFixed(0) + '" y="' + (c.y + 150).toFixed(0) + '" text-anchor="middle">' + taken + ' / ' + mine.length + '</text>' +
            (zi === 0 && O.base ? '<text class="ov-base" x="' + c.x.toFixed(0) + '" y="' + (c.y - 120).toFixed(0) + '" text-anchor="middle">拠点</text>' : '') +
            '</g>';
        }).join('');
      },
      mount: function (slot) {
        if (slot && wrap.parentNode !== slot) slot.appendChild(wrap);
      },
    };
  }

  // ───────── 通知・アイコンの数字・画面を消さない（ホーム画面に追加したアプリ向け） ─────────

  function pushSubscribe(role, pin) {

  // ───────── 電波待ちの申請（つながったら自動で送る） ─────────

  /**
   * 電波がなくて送れなかった申請を、スマホの中（IndexedDB）に預かる。
   * 預かった申請は、つながったとき・画面を開いたとき・20秒ごとに順に送る。占領の時刻は「サーバーに届いた時刻」のまま
   */
  var Outbox = {
    db: null,

    open: function () {
      if (Outbox.db) return Promise.resolve(Outbox.db);

        rq.onsuccess = function () { Outbox.db = rq.result; resolve(Outbox.db); };

    },
    tx: function (mode, fn) {
